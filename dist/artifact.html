<title>有機構造決定パズル</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=IBM+Plex+Mono:wght@500;600&family=Zen+Kaku+Gothic+New:wght@700;900&display=swap">
<style>
:root {
  --ground: #edf0ea;
  --surface: #f8f9f5;
  --paper: #ffffff;
  --ink: #16221e;
  --muted: #5b6862;
  --line: #cfd6cd;
  --accent: #2350a0;
  --accent-ink: #ffffff;
  --accent-soft: #dfe7f5;
  --pos: #b0372b;
  --pos-soft: #f6e1dd;
  --ok: #2c7548;
  --ok-soft: #dcefe2;
  --warn: #9a6512;
  --warn-soft: #f6ead2;
  --shadow: 0 1px 2px rgb(22 34 30 / 0.08), 0 4px 14px rgb(22 34 30 / 0.06);
  --mol-filter: none;
  --f-display: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
  --f-body: "BIZ UDPGothic", "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ground: #111714;
    --surface: #19211d;
    --paper: #1f2824;
    --ink: #e5ebe6;
    --muted: #95a29b;
    --line: #2f3a35;
    --accent: #86a8ea;
    --accent-ink: #0f1a2e;
    --accent-soft: #1f2c44;
    --pos: #eb8579;
    --pos-soft: #3a2320;
    --ok: #74c393;
    --ok-soft: #1c3226;
    --warn: #e2b155;
    --warn-soft: #362c18;
    --shadow: 0 1px 2px rgb(0 0 0 / 0.4);
    --mol-filter: invert(0.9) hue-rotate(180deg);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground: #111714;
  --surface: #19211d;
  --paper: #1f2824;
  --ink: #e5ebe6;
  --muted: #95a29b;
  --line: #2f3a35;
  --accent: #86a8ea;
  --accent-ink: #0f1a2e;
  --accent-soft: #1f2c44;
  --pos: #eb8579;
  --pos-soft: #3a2320;
  --ok: #74c393;
  --ok-soft: #1c3226;
  --warn: #e2b155;
  --warn-soft: #362c18;
  --shadow: 0 1px 2px rgb(0 0 0 / 0.4);
  --mol-filter: invert(0.9) hue-rotate(180deg);
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font: 15px/1.65 var(--f-body);
  -webkit-text-size-adjust: 100%;
}
.wrap { max-width: 760px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 120px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.3; }
h1 { font-size: 1.75rem; font-weight: 900; letter-spacing: 0.02em; }
h2 { font-size: 1.05rem; font-weight: 700; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.eyebrow { font-size: 0.75rem; letter-spacing: 0.12em; color: var(--muted); font-weight: 700; }
.muted { color: var(--muted); }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.formula { font-family: var(--f-mono); font-weight: 600; letter-spacing: 0.02em; }
.formula sub { font-size: 0.68em; vertical-align: -0.25em; line-height: 0; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

.btn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 10px;
  padding: 10px 16px; cursor: pointer; font-weight: 700; min-height: 44px;
}
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.ghost { background: transparent; border-color: transparent; padding-inline: 8px; }
.chip {
  border: 1px solid var(--line); background: transparent; border-radius: 999px;
  padding: 6px 14px; cursor: pointer; font-size: 0.9rem; min-height: 36px;
}
.chip[aria-pressed="true"] { background: var(--ink); color: var(--ground); border-color: var(--ink); }
.chip:disabled { opacity: 0.5; cursor: not-allowed; }
.chip small { font-size: 0.72rem; margin-left: 4px; }

/* ---------- Home ---------- */
.masthead { display: grid; gap: 6px; padding-block: 12px 4px; }
.masthead p { margin: 0; max-width: 34em; color: var(--muted); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.stat b { display: block; font-family: var(--f-mono); font-size: 1.35rem; font-variant-numeric: tabular-nums; }
.stat span { font-size: 0.78rem; color: var(--muted); }
.panel { display: grid; gap: 10px; }
.weak-list { display: flex; flex-wrap: wrap; gap: 6px; }
.weak { background: var(--warn-soft); color: var(--warn); border-radius: 6px; padding: 3px 10px; font-size: 0.85rem; font-weight: 700; }
.plist { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.plist li { border-bottom: 1px solid var(--line); }
.plist button {
  width: 100%; display: grid; grid-template-columns: 3.2em 1fr auto; gap: 12px; align-items: center;
  background: none; border: 0; padding: 12px 4px; cursor: pointer; text-align: left; min-height: 52px;
}
.plist button:hover { background: var(--surface); }
.plist .num { font-family: var(--f-mono); color: var(--muted); font-size: 0.85rem; }
.plist .fm { font-size: 1.1rem; }
.lv { color: var(--warn); letter-spacing: 1px; font-size: 0.8rem; margin-left: 8px; }
.badge { font-size: 0.78rem; font-weight: 700; border-radius: 6px; padding: 2px 8px; font-variant-numeric: tabular-nums; }
.badge.ok { background: var(--ok-soft); color: var(--ok); }
.badge.ng { background: var(--pos-soft); color: var(--pos); }
.badge.new { color: var(--muted); border: 1px dashed var(--line); }

/* ---------- Board ---------- */
.board-head {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--ground); padding-block: 8px 10px; border-bottom: 1px solid var(--line);
  display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 8px;
}
.board-head .formula { font-size: 2.1rem; line-height: 1.1; }
.meter { text-align: right; font-size: 0.85rem; color: var(--muted); }
.meter b { font-family: var(--f-mono); font-size: 1.15rem; color: var(--ink); font-variant-numeric: tabular-nums; }
.hint { font-size: 0.88rem; color: var(--muted); margin: 0; }

.cands { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (min-width: 620px) { .cands { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.cand {
  position: relative; background: var(--paper); border: 1px solid var(--line); border-radius: 12px;
  box-shadow: var(--shadow); touch-action: pan-y; user-select: none; -webkit-user-select: none;
  transition: transform 0.18s ease, opacity 0.18s ease; overflow: hidden;
}
.cand.dragging { transition: none; }
.cand .mol { padding: 6px 6px 0; }
.mol svg { display: block; width: 100%; height: auto; filter: var(--mol-filter); }
.cand .bar { display: flex; justify-content: space-between; align-items: center; padding: 0 6px 6px 10px; }
.cand .tag { font-family: var(--f-mono); font-size: 0.8rem; color: var(--muted); }
.x-btn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 8px;
  min-width: 44px; min-height: 36px; cursor: pointer; font-weight: 700; font-size: 0.85rem;
}
.cand.struck { opacity: 0.38; }
.cand.struck .mol { filter: grayscale(1); }
.cand.struck::after {
  content: ""; position: absolute; left: 8%; right: 8%; top: 44%; height: 2px;
  background: var(--pos); transform: rotate(-12deg); pointer-events: none;
}
.cand.struck .x-btn { opacity: 1; }
.cand.chosen { outline: 3px solid var(--accent); outline-offset: -3px; }

.deck { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (min-width: 620px) { .deck { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.clue {
  border: 1px solid var(--line); border-radius: 12px; background: var(--surface);
  padding: 12px; text-align: left; cursor: pointer; display: grid; gap: 6px; align-content: start; min-height: 96px;
}
.clue .cname { font-family: var(--f-display); font-weight: 700; font-size: 1rem; }
.clue .act { font-size: 0.8rem; color: var(--muted); line-height: 1.45; }
.clue.closed {
  background:
    repeating-linear-gradient(135deg, transparent 0 9px, color-mix(in srgb, var(--line) 55%, transparent) 9px 10px),
    var(--surface);
}
.clue.closed .res { font-size: 0.8rem; color: var(--accent); font-weight: 700; }
.clue.open { cursor: default; background: var(--paper); border-color: var(--ink); }
.clue .res { font-weight: 700; }
.res.pos { color: var(--pos); }
.res.neg { color: var(--muted); }
.res.num { font-family: var(--f-mono); font-size: 1.1rem; }
.products { display: flex; flex-wrap: wrap; gap: 6px; }
.prod { flex: 1 1 110px; min-width: 0; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); padding: 4px; }
.prod .pn { font-size: 0.75rem; text-align: center; color: var(--muted); }
.clue.wide { grid-column: 1 / -1; }

.dock {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  background: color-mix(in srgb, var(--ground) 92%, transparent);
  backdrop-filter: blur(8px); border-top: 1px solid var(--line);
  padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
}
.dock-in { max-width: 760px; margin: 0 auto; display: flex; gap: 10px; align-items: center; justify-content: space-between; }
.dock-in .hint { flex: 1; }

/* ---------- Result ---------- */
.verdict { display: grid; gap: 4px; padding: 16px; border-radius: 14px; }
.verdict.ok { background: var(--ok-soft); color: var(--ok); }
.verdict.ng { background: var(--pos-soft); color: var(--pos); }
.verdict h2 { font-size: 1.6rem; font-weight: 900; }
.verdict .score { font-family: var(--f-mono); font-size: 1rem; }
.pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.molcard { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 6px; }
.molcard .cap { font-size: 0.8rem; padding: 0 6px 4px; }
.molcard .cap b { display: block; font-size: 0.72rem; letter-spacing: 0.08em; color: var(--muted); }
.notes { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.notes li { border-left: 3px solid var(--pos); background: var(--surface); padding: 8px 12px; border-radius: 0 8px 8px 0; font-size: 0.92rem; }
.notes li.warn { border-left-color: var(--warn); }
.notes li.good { border-left-color: var(--ok); }
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
table.key { border-collapse: collapse; font-size: 0.82rem; min-width: 100%; }
table.key th, table.key td { padding: 7px 10px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
table.key thead th { font-size: 0.75rem; color: var(--muted); font-weight: 700; }
table.key tr.ans td:first-child { font-weight: 700; color: var(--ok); }
table.key td.bad { background: var(--pos-soft); color: var(--pos); font-weight: 700; }
table.key td.hid { color: var(--muted); }

/* ---------- Night lock ---------- */
.night {
  position: fixed; inset: 0; z-index: 50; background: #0b0f14; color: #c9d3dc;
  display: grid; place-items: center; padding: 24px;
}
.night div { max-width: 26em; display: grid; gap: 12px; }
.night h2 { color: #f0f3f6; font-size: 1.5rem; }
.night p { margin: 0; }
.night .clock { font-family: var(--f-mono); font-size: 2.4rem; color: #7d8fa3; }

@media (prefers-reduced-motion: reduce) { .cand { transition: none; } }
</style>

</div>

const PER_CARD = 10;      // 手がかり1枚ごとの減点
const PER_GUESS = 10;     // 根拠なしで消した候補1つごとの減点
const NIGHT_FROM = 23, NIGHT_UNTIL = 5;
const STORE_KEY = 'jouzoukettei.v1';

// ---------- 記録 ----------
function loadStore() {
  try {
    const s = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
    if (s && s.stats && s.weak && s.history) return s;
  } catch (e) {}
  return { stats: {}, weak: {}, history: [] };
}
function saveStore() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch (e) {}
}
let store = loadStore();

// ---------- 小道具 ----------
const $ = (sel, root = document) => root.querySelector(sel);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmtFormula = (f) => esc(f).replace(/(\d+)/g, '<sub>$1</sub>');
const stars = (n) => '★'.repeat(n) + '☆'.repeat(3 - n);
const molName = (s) => (DATA.molecules[s] && DATA.molecules[s].name) || s;
const molSvg = (s) => DATA.molecules[s].svg;
const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
const letter = (i) => String.fromCharCode(65 + i);

function resultText(card, r) {
  const c = DATA.cards[card];
  if (c.kind === 'bool') return r ? c.yes : c.no;
  if (c.kind === 'count') return `${r} 個`;
  if (!r.length) return c.none;
  return r.map(molName).join(' ＋ ');
}
function resultHtml(card, r) {
  const c = DATA.cards[card];
  if (c.kind === 'bool') return `<span class="res ${r ? 'pos' : 'neg'}">${esc(r ? c.yes : c.no)}</span>`;
  if (c.kind === 'count') return `<span class="res num">${r} 個</span>`;
  if (!r.length) return `<span class="res neg">${esc(c.none)}</span>`;
  return `<span class="res">生成物</span><div class="products">${r.map((s) =>
    `<div class="prod"><div class="mol">${molSvg(s)}</div><div class="pn">${esc(molName(s))}</div></div>`).join('')}</div>`;
}

function isNight(d = new Date()) {
  const h = d.getHours();
  return h >= NIGHT_FROM || h < NIGHT_UNTIL;
}
function checkNight() {
  const now = new Date();
  $('#night-clock').textContent = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
  $('#night').hidden = !isNight(now);
}

// ---------- 出題 ----------
let view = { screen: 'home', level: 0 };
let game = null;

function accuracy(n = 20) {
  const h = store.history.slice(-n);
  if (!h.length) return null;
  return Math.round((100 * h.filter((x) => x.correct).length) / h.length);
}

function pickProblem(level, avoidId) {
  const pool = DATA.problems.filter((p) => (!level || p.level === level) && p.id !== avoidId);
  const list = pool.length ? pool : DATA.problems;
  const weights = list.map((p) => {
    const st = store.stats[p.id];
    let w = 1;
    if (!st) w += 2;
    else if (!st.lastCorrect) w += 3;
    else w *= 0.4;
    for (const c of p.clues) w += Math.min(3, store.weak[c.card] || 0);
    return w;
  });
  let r = Math.random() * weights.reduce((a, b) => a + b, 0);
  for (let i = 0; i < list.length; i++) {
    r -= weights[i];
    if (r <= 0) return list[i];
  }
  return list[list.length - 1];
}

function startGame(p) {
  if (isNight()) { checkNight(); return; }
  game = { p, struck: new Set(), opened: [], chosen: null, done: false };
  view.screen = 'play';
  render();
  window.scrollTo(0, 0);
}

function remaining() {
  return game.p.candidates.map((_, i) => i).filter((i) => !game.struck.has(i));
}
function liveScore() {
  return Math.max(0, 100 - PER_CARD * game.opened.length);
}

            </button>`;
          }).join('')}
        </div>
      </section>
    </div>
    <div class="dock"><div class="dock-in">
      <p class="hint">${rest.length === 1 ? `残りは ${letter(rest[0])}。これで確定するか？` : rest.length === 0 ? '全部消えている。どれかを戻す。' : `あと ${rest.length - 1} つ消すと確定できる`}</p>
      <button class="btn primary" id="submit" ${rest.length === 1 ? '' : 'disabled'}>確定</button>
    </div></div>`;

  $('#back').onclick = () => { view.screen = 'home'; render(); };
  $('#deck').onclick = (e) => {
    const b = e.target.closest('[data-ci]');
    if (!b) return;
    const ci = +b.dataset.ci;
    if (game.opened.includes(ci)) return;
    game.opened.push(ci);
    render();
  };
  $('#submit').onclick = () => {
    const r = remaining();
    if (r.length === 1) finish(r[0]);
  };
  bindCandidates();
}

function toggleStrike(i) {
  if (game.struck.has(i)) game.struck.delete(i);
  else game.struck.add(i);
  render();
}

function bindCandidates() {
  const box = $('#cands');
  box.addEventListener('click', (e) => {
    const b = e.target.closest('[data-x]');
    if (b) toggleStrike(+b.dataset.x);
  });
  box.querySelectorAll('.cand').forEach((el) => {
    let x0 = null, y0 = 0, dx = 0, horiz = false;
    el.addEventListener('pointerdown', (e) => {
      if (e.target.closest('[data-x]')) return;
      x0 = e.clientX; y0 = e.clientY; dx = 0; horiz = false;
    });
    el.addEventListener('pointermove', (e) => {
      if (x0 === null) return;
      dx = e.clientX - x0;
      const dy = e.clientY - y0;
      if (!horiz && Math.abs(dx) > 12 && Math.abs(dx) > Math.abs(dy)) {
        horiz = true;
        el.classList.add('dragging');
        try { el.setPointerCapture(e.pointerId); } catch (err) {}
      }
      if (horiz) el.style.transform = `translateX(${dx}px) rotate(${dx / 30}deg)`;
    });
    const end = () => {
      if (x0 === null) return;
      x0 = null;
      el.classList.remove('dragging');
      el.style.transform = '';
      if (horiz && Math.abs(dx) > 70) toggleStrike(+el.dataset.i);
    };
    el.addEventListener('pointerup', end);
    el.addEventListener('pointercancel', end);
  });
}

// ---------- 判定 ----------
function finish(chosen) {
  const p = game.p;
  const correct = chosen === p.answer;
  // 開いた手がかりのうち、その候補を除外できるもの
  const excludedBy = (k, clueIdx) => clueIdx.filter((ci) => !same(p.clues[ci].byCandidate[k], p.clues[ci].result));
  const all = p.clues.map((_, ci) => ci);
  const guesses = [...game.struck].filter((k) => k !== p.answer && excludedBy(k, game.opened).length === 0);
  const contradictions = correct ? [] : excludedBy(chosen, all);
  const score = correct ? Math.max(0, liveScore() - PER_GUESS * guesses.length) : 0;

  // 記録と復習リスト
  const bump = (card, d) => { store.weak[card] = Math.max(0, (store.weak[card] || 0) + d); };
  contradictions.forEach((ci) => bump(p.clues[ci].card, 1));
  guesses.forEach((k) => excludedBy(k, all).forEach((ci) => bump(p.clues[ci].card, 1)));
  if (correct && !guesses.length) game.opened.forEach((ci) => bump(p.clues[ci].card, -1));
  const st = store.stats[p.id] || { tries: 0, correct: 0, best: 0, everCorrect: false };
  st.tries++;
  if (correct) { st.correct++; st.everCorrect = true; st.best = Math.max(st.best, score); }
  st.lastCorrect = correct && !guesses.length;
  store.stats[p.id] = st;
  store.history.push({ id: p.id, correct, score, at: Date.now() });
  store.history = store.history.slice(-200);
  saveStore();

  game.done = { chosen, correct, guesses, contradictions, score, excludedBy };
  view.screen = 'result';
  render();
  window.scrollTo(0, 0);
}

function renderResult() {
  const p = game.p;
  const r = game.done;
  const all = p.clues.map((_, ci) => ci);
  const molCard = (k, cap) => `<div class="molcard"><div class="mol">${molSvg(p.candidates[k])}</div>
    <div class="cap"><b>${cap}</b>${esc(molName(p.candidates[k]))}</div></div>`;
  const notes = [];
  if (!r.correct) {
    r.contradictions.forEach((ci) => {
      const c = p.clues[ci];
      notes.push(`<li><b>${esc(DATA.cards[c.card].name)}</b>${game.opened.includes(ci) ? '' : '（未開封）'}: 
        ${letter(r.chosen)} なら「${esc(resultText(c.card, c.byCandidate[r.chosen]))}」になるはず。実際は「${esc(resultText(c.card, c.result))}」。</li>`);
    });
  }
  if (game.struck.has(p.answer)) notes.push(`<li>正解の ${letter(p.answer)} を一度消している。</li>`);
  r.guesses.forEach((k) => {
    const cards = r.excludedBy(k, all).map((ci) => DATA.cards[p.clues[ci].card].name);
    notes.push(`<li class="warn">${letter(k)}（${esc(molName(p.candidates[k]))}）は開いたカードでは消せない。根拠なしで消した（−${PER_GUESS}）。消すなら <b>${esc(cards.join('・'))}</b> を開く。</li>`);
  });
  if (r.correct && !r.guesses.length) notes.push(`<li class="good">全部の消去に根拠がある。開いたカード ${game.opened.length} 枚 / 全 ${p.clues.length} 枚。</li>`);

  $('#app').innerHTML = `
    <div class="stack">
      <div class="verdict ${r.correct ? 'ok' : 'ng'}">
        <span class="eyebrow" style="color:inherit">${p.id} ・ <span class="formula">${fmtFormula(p.formula)}</span></span>
        <h2>${r.correct ? '正解' : '不正解'}</h2>
        <span class="score">${r.score} 点</span>
      </div>
      <div class="pair">
        ${molCard(r.chosen, 'あなたの答え ' + letter(r.chosen))}
        ${r.correct ? '' : molCard(p.answer, '正解 ' + letter(p.answer))}
      </div>
      ${notes.length ? `<ul class="notes">${notes.join('')}</ul>` : ''}
      <section class="panel">
        <h2>答え合わせ表</h2>
        <p class="hint">各候補にカードを当てたときの結果。赤は実際の結果と矛盾するところ。</p>
        <div class="tbl-wrap"><table class="key">
          <thead><tr><th>候補</th>${p.clues.map((c) => `<th>${esc(DATA.cards[c.card].name)}</th>`).join('')}</tr></thead>
          <tbody>
            <tr><td class="hid">実際の結果</td>${p.clues.map((c) => `<td><b>${esc(resultText(c.card, c.result))}</b></td>`).join('')}</tr>
            ${p.candidates.map((s, k) => `<tr class="${k === p.answer ? 'ans' : ''}">
              <td>${letter(k)} ${esc(molName(s))}</td>
              ${p.clues.map((c) => `<td class="${same(c.byCandidate[k], c.result) ? '' : 'bad'}">${esc(resultText(c.card, c.byCandidate[k]))}</td>`).join('')}
            </tr>`).join('')}
          </tbody>
        </table></div>
      </section>
      <div class="row">
        <button class="btn primary" id="next">次の問題（おまかせ）</button>
        <button class="btn" id="retry">もう一度</button>
        <button class="btn ghost" id="home">問題一覧</button>
      </div>
    </div>`;
  $('#next').onclick = () => startGame(pickProblem(view.level, p.id));
  $('#retry').onclick = () => startGame(p);
  $('#home').onclick = () => { view.screen = 'home'; render(); };
}

function render() {
  if (view.screen === 'play' && game) renderPlay();
  else if (view.screen === 'result' && game && game.done) renderResult();
  else renderHome();
}

if (!DATA) {
  $('#app').innerHTML = '<p>問題データがない。<code>npm run build</code> で dist/index.html を作る。</p>';
} else {
  checkNight();
  setInterval(checkNight, 30000);
  render();
}
</script>
