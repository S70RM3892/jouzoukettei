<style>

  --f-display: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;

}
@media (prefers-color-scheme: dark) {

    --paper: #1f2824;
    --ink: #e5ebe6;
    --muted: #95a29b;
    --line: #2f3a35;
    --accent: #86a8ea;
    --accent-ink: #0f1a2e;
    --accent-soft: #1f2c44;
    --pos: #eb8579;

    --ok-soft: #1c3226;

  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground: #111714;
  --surface: #19211d;
  --paper: #1f2824;
  --ink: #e5ebe6;
  --muted: #95a29b;
  --line: #2f3a35;
  --accent: #86a8ea;
  --accent-ink: #0f1a2e;

/* ---------- Result ---------- */

.pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }

.progress { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 0.82rem; }
.step { border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; color: var(--muted); }
.step.done { background: var(--ok-soft); color: var(--ok); border-color: transparent; }

.solved { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); padding: 8px 12px; }
.solved summary { cursor: pointer; font-weight: 700; font-size: 0.9rem; min-height: 32px; display: flex; align-items: center; }
.solved-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; padding-top: 8px; }

#opts .btn { min-width: 52px; font-family: var(--f-mono); font-size: 1.1rem; }
.eq { font-size: 0.95rem; overflow-wrap: anywhere; }
.xcard { max-width: 420px; }
.stepper { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
  border-bottom: 1px solid var(--line); padding-block: 8px; }
.stepper output { font-size: 1.6rem; min-width: 2.2em; text-align: center; font-variant-numeric: tabular-nums; }

.conds { margin: 0; padding-left: 1.2em; display: grid; gap: 6px; }
.cands.one { grid-template-columns: minmax(0, 1fr); max-width: 520px; }

.plist .sub { font-size: .8rem; margin-left: 6px; }

/* ---------- Online ---------- */
table.rank tr.me td { background: var(--accent-soft); font-weight: 700; }
.composer { display: grid; gap: 8px; }
.composer textarea { width: 100%; font: inherit; color: var(--ink); background: var(--paper); border: 1px solid var(--line);
  border-radius: 10px; padding: 10px 12px; resize: vertical; }

.codein { font: inherit; font-family: var(--f-mono); font-size: 1.1rem; width: 9em; padding: 10px 12px; min-height: 44px;
  border: 1px solid var(--line); border-radius: 10px; background: var(--paper); color: var(--ink); text-transform: lowercase; }
.codebox { display: grid; gap: 2px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; }
.big { font-size: 1.8rem; letter-spacing: 0.1em; }

.racer { display: grid; grid-template-columns: 1.5em minmax(0, 7em) 1fr auto; gap: 8px; align-items: center; font-size: 0.85rem; }
.racer.me .rname { font-weight: 700; }
.rname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  <div>

    <h2>23時を過ぎた。今日はここまで。</h2>
    <p>寝る前に画面を見ると寝付きが悪くなる。明日の頭のほうが構造決定は速い。</p>
    <p class="muted">5時以降にまた開ける。</p>

<script>
const DATA = /*__PUZZLE_DATA__*/null;
const PER_CARD = 10;      // 最少枚数を超えて開いた手がかり1枚ごとの減点
const PER_GUESS = 10;     // 根拠なしで消した候補1つごとの減点
const NIGHT_FROM = 23, NIGHT_UNTIL = 5;
const STORE_KEY = 'jouzoukettei.v1';
const MODES = [
  { key: 'narrow', name: '絞り込み型', note: '断片1つを決める' },
  { key: 'big', name: '大問型', note: '分解 → 断片 → 組み立て' },
  { key: 'count', name: '数え上げ型', note: '異性体を数える' },
  { key: 'polymer', name: '高分子型', note: '重合度を計算し、単量体を決める' },
  { key: 'gen', name: '京大レベル', note: '京大の過去問の答えを同じ物差しで測り、その難易度帯に入るものだけを採った自動生成の大問' },
];

// ---------- 記録 ----------
function loadStore() {
  try {
    const s = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
    if (s && s.stats && s.weak && s.history) return s;
  } catch (e) {}
  return { stats: {}, weak: {}, history: [] };
}
function saveStore() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch (e) {}
}
let store = loadStore();

function record(id, correct, score) {
  const st = store.stats[id] || { tries: 0, correct: 0, best: 0, everCorrect: false };
  st.tries++;
  if (correct) { st.correct++; st.everCorrect = true; st.best = Math.max(st.best, score); }
  st.lastCorrect = correct;
  store.stats[id] = st;
  store.history.push({ id, correct, score, at: Date.now() });
  store.history = store.history.slice(-200);
  saveStore();
  if (correct) syncScore();
}
const bump = (card, d) => { store.weak[card] = Math.max(0, (store.weak[card] || 0) + d); };

// ---------- 小道具 ----------
const $ = (sel, root = document) => root.querySelector(sel);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmtFormula = (f) => esc(f).replace(/(\d+)/g, '<sub>$1</sub>');
const stars = (n) => '★'.repeat(n) + '☆'.repeat(3 - n);
const molName = (s) => { const m = DATA.molecules[s]; return (m && (m.name || (m.formula && m.formula.replace(/\d+/g, (d) => [...d].map((x) => '₀₁₂₃₄₅₆₇₈₉'[x]).join(''))))) || s; };
const molSvg = (s) => DATA.molecules[s].svg;
const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
const letter = (i) => String.fromCharCode(0x2460 + i); // ① ② ③ …
const unit = (card) => (card === 'chiral' ? '個' : '種類');
const byId = (id) => DATA.problems.find((p) => p.id === id);

function resultText(card, r) {
  const c = DATA.cards[card];
  if (c.kind === 'bool') return r ? c.yes : c.no;
  if (c.kind === 'count') return `${r} ${unit(card)}`;
  if (c.kind === 'contains') return r ? `${molName(r)} ${c.yes}` : `その化合物${c.no}`;
  if (!r.length) return c.none;
  return r.map(molName).join(' ＋ ');
}
function resultHtml(card, r) {
  const c = DATA.cards[card];
  if (c.kind === 'bool') return `<span class="res ${r ? 'pos' : 'neg'}">${esc(r ? c.yes : c.no)}</span>`;
  if (c.kind === 'count') return `<span class="res num">${r} ${unit(card)}</span>`;
  if (c.kind === 'contains') {
    return `<span class="res">次の化合物${esc(c.yes)}</span><div class="products"><div class="prod"><div class="mol">${molSvg(r)}</div><div class="pn">${esc(molName(r))}</div></div></div>`;
  }
  if (!r.length) return `<span class="res neg">${esc(c.none)}</span>`;
  return `<span class="res">生成物</span><div class="products">${r.map((s) =>
    `<div class="prod"><div class="mol">${molSvg(s)}</div><div class="pn">${esc(molName(s))}</div></div>`).join('')}</div>`;
}

function isNight(d = new Date()) {
  const h = d.getHours();
  return h >= NIGHT_FROM || h < NIGHT_UNTIL;
}
function checkNight() {
  const now = new Date();
  $('#night-clock').textContent = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
  $('#night').hidden = !isNight(now);
}

// ---------- 出題 ----------
let view = { screen: 'home', level: 0, mode: 'narrow' };
let game = null;

function accuracy(n = 20) {
  const h = store.history.slice(-n);
  if (!h.length) return null;
  return Math.round((100 * h.filter((x) => x.correct).length) / h.length);
}

function cardsOf(p) {
  if (p.stages) return p.stages.flatMap((s) => s.clues || []).map((c) => c.card);
  return p.clues.map((c) => c.card);
}

function pickProblem(level, avoidId) {
  const inMode = DATA.problems.filter((p) => p.mode === view.mode);
  const pool = inMode.filter((p) => (!level || p.level === level) && p.id !== avoidId);
  const list = pool.length ? pool : inMode;
  const weights = list.map((p) => {
    const st = store.stats[p.id];
    let w = 1;
    if (!st) w += 2;
    else if (!st.lastCorrect) w += 3;
    else w *= 0.4;
    for (const c of new Set(cardsOf(p))) w += Math.min(3, store.weak[c] || 0);
    return w;
  });
  let r = Math.random() * weights.reduce((a, b) => a + b, 0);
  for (let i = 0; i < list.length; i++) {
    r -= weights[i];
    if (r <= 0) return list[i];
  }
  return list[list.length - 1];
}

function show(screen) {
  view.screen = screen;
  render();
  window.scrollTo(0, 0);
}

function startProblem(p) {
  if (isNight()) { checkNight(); return; }
  if (p.mode === 'big' || p.mode === 'polymer' || p.mode === 'gen') {
    game = { big: { P: p, idx: 0, scores: [], allCorrect: true } };
    goStage();
  } else if (p.mode === 'count') {
    game = { count: { P: p, nStruct: 0, nStereo: 0, done: null } };
    show('count');
  } else {
    startNarrow(p);
  }
}

function startNarrow(p, big) {
  game = { p, struck: new Set(), opened: [], done: false, big };
  show('play');
}

// ---------- 大問の進行 ----------
function goStage() {
  const b = game.big;
  const st = b.P.stages[b.idx];
  if (!st) { show('bigdone'); return; }
  if (st.type === 'split') { game = { big: b, split: { answer: null } }; show('split'); }
  else if (st.type === 'given') { game = { big: b }; show('given'); }
  else if (st.type === 'calc') { game = { big: b, calc: { answer: null } }; show('calc'); }
  else startNarrow(st, b);
}
function nextStage(score, correct) {
  const b = game.big;
  if (score !== null) b.scores.push(score);
  if (!correct) b.allCorrect = false;
  b.idx++;
  goStage();
}

function bigProgress() {
  if (!game || !game.big) return '';
  const b = game.big;
  const label = (s) => (s.type === 'split' ? '分解' : s.type === 'calc' ? CALC_SHORT[s.key] || '計算' : s.label === 'X' ? '組み立て' : s.label);
  return `<div class="progress" aria-label="大問の進み具合">
    <span class="muted mono" style="font-size:.8rem">${esc(b.P.id)}</span>
    ${b.P.stages.map((s, i) => `<span class="step ${i < b.idx ? 'done' : i === b.idx ? 'now' : ''}">${esc(label(s))}</span>`).join('<span class="arrow">→</span>')}
  </div>`;
}

// これまでに決まった断片（大問の途中で見返す用）
function solvedSoFar() {
  if (!game || !game.big) return '';
  const b = game.big;
  const done = b.P.stages.slice(0, b.idx).filter((s) => s.type === 'narrow' || s.type === 'given');
  if (!done.length) return '';
  const smiles = (s) => (s.type === 'given' ? s.smiles : s.candidates[s.answer]);
  return `<details class="solved"><summary>決まった構造（${done.map((s) => s.label).join('・')}）</summary>
    <div class="solved-grid">${done.map((s) => `<div class="molcard"><div class="mol">${molSvg(smiles(s))}</div>
      <div class="cap"><b>${esc(s.label)}</b>${esc(molName(smiles(s)))}</div></div>`).join('')}</div></details>`;
}

function remaining() {
  return game.p.candidates.map((_, i) => i).filter((i) => !game.struck.has(i));
}
function liveScore() {
  const extra = Math.max(0, game.opened.length - (game.p.minCards || 0));
  return Math.max(0, 100 - PER_CARD * extra);
}

function toggleStrike(i) {
  if (game.struck.has(i)) game.struck.delete(i);
  else game.struck.add(i);
  render();
}

function bindCandidates() {
  const box = $('#cands');
  box.addEventListener('click', (e) => {
    const b = e.target.closest('[data-x]');
    if (b) toggleStrike(+b.dataset.x);
  });
  box.querySelectorAll('.cand').forEach((el) => {
    let x0 = null, y0 = 0, dx = 0, horiz = false;
    el.addEventListener('pointerdown', (e) => {
      if (e.target.closest('[data-x]')) return;
      x0 = e.clientX; y0 = e.clientY; dx = 0; horiz = false;
    });
    el.addEventListener('pointermove', (e) => {
      if (x0 === null) return;
      dx = e.clientX - x0;
      const dy = e.clientY - y0;
      if (!horiz && Math.abs(dx) > 12 && Math.abs(dx) > Math.abs(dy)) {
        horiz = true;
        el.classList.add('dragging');
        try { el.setPointerCapture(e.pointerId); } catch (err) {}
      }
      if (horiz) el.style.transform = `translateX(${dx}px) rotate(${dx / 30}deg)`;
    });
    const end = () => {
      if (x0 === null) return;
      x0 = null;
      el.classList.remove('dragging');
      el.style.transform = '';
      if (horiz && Math.abs(dx) > 70) toggleStrike(+el.dataset.i);
    };
    el.addEventListener('pointerup', end);
    el.addEventListener('pointercancel', end);
  });
}

// ---------- 判定（絞り込み） ----------
function finish(chosen) {
  const p = game.p;
  const correct = chosen === p.answer;
  // 手がかりのうち、その候補を除外できるもの
  const excludedBy = (k, clueIdx) => clueIdx.filter((ci) => !same(p.clues[ci].byCandidate[k], p.clues[ci].result));
  const all = p.clues.map((_, ci) => ci);
  const guesses = [...game.struck].filter((k) => k !== p.answer && excludedBy(k, game.opened).length === 0);
  const contradictions = correct ? [] : excludedBy(chosen, all);
  const score = correct ? Math.max(0, liveScore() - PER_GUESS * guesses.length) : 0;

  // 復習リスト
  contradictions.forEach((ci) => bump(p.clues[ci].card, 1));
  guesses.forEach((k) => excludedBy(k, all).forEach((ci) => bump(p.clues[ci].card, 1)));
  if (correct && !guesses.length) game.opened.forEach((ci) => bump(p.clues[ci].card, -1));
  if (game.big) saveStore();
  else record(p.id, correct && !guesses.length, score);

  game.done = { chosen, correct, guesses, contradictions, score, excludedBy };
  show('result');
}

function molCardHtml(smiles, cap) {
  return `<div class="molcard"><div class="mol">${molSvg(smiles)}</div>
    <div class="cap"><b>${cap}</b>${esc(molName(smiles))}</div></div>`;
}

function renderResult() {
  const p = game.p;
  const r = game.done;
  const all = p.clues.map((_, ci) => ci);
  const notes = [];
  if (!r.correct) {
    r.contradictions.forEach((ci) => {
      const c = p.clues[ci];
      notes.push(`<li><b>${esc(DATA.cards[c.card].name)}</b>${game.opened.includes(ci) ? '' : '（未開封）'}:
        ${letter(r.chosen)} なら「${esc(resultText(c.card, c.byCandidate[r.chosen]))}」になるはず。実際は「${esc(resultText(c.card, c.result))}」。</li>`);
    });
  }
  if (game.struck.has(p.answer)) notes.push(`<li>正解の ${letter(p.answer)} を一度消している。</li>`);
  r.guesses.forEach((k) => {
    const cards = r.excludedBy(k, all).map((ci) => DATA.cards[p.clues[ci].card].name);
    notes.push(`<li class="warn">${letter(k)}（${esc(molName(p.candidates[k]))}）は開いたカードでは消せない。根拠なしで消した（−${PER_GUESS}）。消すなら <b>${esc(cards.join('・'))}</b> を開く。</li>`);
  });
  if (r.correct && !r.guesses.length) {
    const extra = game.opened.length - p.minCards;
    notes.push(extra <= 0
      ? `<li class="good">全部の消去に根拠があり、最少の ${p.minCards} 枚で決めた。</li>`
      : `<li class="good">全部の消去に根拠がある。開いたのは ${game.opened.length} 枚で、最少 ${p.minCards} 枚より ${extra} 枚多い（−${PER_CARD * extra}）。</li>`);
  }

  const inBig = !!game.big;
  const last = inBig && game.big.idx === game.big.P.stages.length - 1;
  $('#app').innerHTML = `
    <div class="stack">
      ${bigProgress()}
      <div class="verdict ${r.correct ? 'ok' : 'ng'}">
        <span class="eyebrow" style="color:inherit">${esc(p.id)} ・ <span class="formula">${fmtFormula(p.formula)}</span></span>
        <h2>${r.correct ? '正解' : '不正解'}</h2>
        <span class="score">${r.score} 点</span>
      </div>
      <div class="pair">
        ${molCardHtml(p.candidates[r.chosen], 'あなたの答え ' + letter(r.chosen))}
        ${r.correct ? '' : molCardHtml(p.candidates[p.answer], '正解 ' + letter(p.answer))}
      </div>
      ${inBig && !r.correct ? '<p class="hint">大問では正解の構造を使って次の段階へ進む。</p>' : ''}
      ${notes.length ? `<ul class="notes">${notes.join('')}</ul>` : ''}
      <section class="panel">
        <h2>答え合わせ表</h2>
        <p class="hint">各候補にカードを当てたときの結果。赤は実際の結果と矛盾するところ。</p>
        <div class="tbl-wrap"><table class="key">
          <thead><tr><th>候補</th>${p.clues.map((c) => `<th>${esc(DATA.cards[c.card].name)}</th>`).join('')}</tr></thead>
          <tbody>
            <tr><td class="hid">実際の結果</td>${p.clues.map((c) => `<td><b>${esc(resultText(c.card, c.result))}</b></td>`).join('')}</tr>
            ${p.candidates.map((s, k) => `<tr class="${k === p.answer ? 'ans' : ''}">
              <td>${letter(k)} ${esc(molName(s))}</td>
              ${p.clues.map((c) => `<td class="${same(c.byCandidate[k], c.result) ? '' : 'bad'}">${esc(resultText(c.card, c.byCandidate[k]))}</td>`).join('')}
            </tr>`).join('')}
          </tbody>
        </table></div>
      </section>
      <div class="row">
        ${inBig
          ? `<button class="btn primary" id="next">${last ? '大問の結果へ' : '次の段階へ'}</button>`
          : `<button class="btn primary" id="next">次の問題（おまかせ）</button>
             <button class="btn" id="retry">もう一度</button>`}
        <button class="btn ghost" id="home">問題一覧</button>
      </div>
    </div>`;
  $('#next').onclick = () => (inBig ? nextStage(r.score, r.correct) : startProblem(pickProblem(view.level, p.id)));
  if (!inBig) $('#retry').onclick = () => startProblem(p);
  $('#home').onclick = () => show('home');
}

const CALC_SHORT = { dp: '重合度', per: '計算', h2: 'H₂付加', combustion: '燃焼', combustion_x: 'Xの分子式', n_x: '候補の数' };
const CALC_LONG = { dp: '重合度の計算', per: '結合・分子の数', h2: '水素付加量の計算', combustion: '燃焼分析', combustion_x: 'X の分子式（燃焼分析）', n_x: 'つなぎ方の候補の数' };

// 京大レベルの説明（何年度の何題を物差しにしたか・いつの種か）
function genNote() {
  const gen = DATA.problems.filter((p) => p.mode === 'gen');
  const k = gen.filter((p) => p.kyoto).length;
  const g = gen.find((p) => !p.kyoto);
  const band = g ? g.band : null;
  const seed = g && g.seed ? `${g.seed.slice(0, 4)}-${g.seed.slice(4, 6)}-${g.seed.slice(6, 8)}` : '';
  return `。京大の答え ${k} 題を同じ手順で問題化したもの（「京大○年度型の再現」）と、その難易度${band ? ` ${band[0]}〜${band[1]}` : ''} に入る自動生成 ${gen.length - k} 題。${seed ? `自動生成は ${seed} の朝5時に入れ替わった。` : ''}`;
}

}

// ---------- オンライン（claude.ai で開いたときだけ動く） ----------
// A: ランキング   db の scores/<自分のid> に解いた問題の一覧を書き、全員分を読んで並べる
// B: 意見投稿欄   db の posts/<自分のid> に自分の投稿（最新50件）を持つ
// C: 早解き対戦   room の名前付き部屋で同じ問題を同時に解き、進み具合を presence で共有する
const RACE_LEN = 5;
const RACE_PENALTY = 10000;
const POST_MAX = 300;
const online = { ready: false, off: false, user: null, db: null, room: null, uid: null, scores: [], posts: [], writeErr: null };
let writeChain = Promise.resolve();

async function initOnline() {
  if (!window.claude || typeof window.claude.use !== 'function') {
    online.ready = true;
    online.off = true;
    return;
  }
  const [user, db, room] = await Promise.all([
    window.claude.use('user'), window.claude.use('db'), window.claude.use('room'),
  ]);
  Object.assign(online, { user, db, room });
  online.uid = user ? await user.id() : null;
  online.ready = true;
  if (db) {
    db.collection('scores').orderBy('solved', 'desc').limit(200).onSnapshot((s) => {
      online.scores = s.docs.map((d) => ({ id: d.id, ...d.data() }));
      refreshOnline();
    }, () => { online.scores = []; });
    db.collection('posts').onSnapshot((s) => {
      online.posts = s.docs.map((d) => ({ id: d.id, ...d.data() }));
      refreshOnline();
    }, () => { online.posts = []; });
    if (online.uid) mergeRemoteScore();
  }
  refreshOnline();
}

// 画面全体ではなく一覧だけ描き直す（入力中の文字を消さないため）
function refreshOnline() {
  if (view.screen === 'rank') { const el = $('#rank-list'); if (el) { el.innerHTML = rankListHtml(); fillNames(el); } }
  if (view.screen === 'posts') { const el = $('#post-list'); if (el) { el.innerHTML = postListHtml(); fillNames(el); bindPostDeletes(); } }
  if (view.screen === 'home') { const el = $('#online-status'); if (el) el.innerHTML = onlineStatusHtml(); }
}

// data-uid を持つ要素に名前を入れる。名前は保存せず、表示のたびに引く
async function fillNames(root) {
  if (!online.user) return;
  const els = [...root.querySelectorAll('[data-uid]')];
  const ids = [...new Set(els.map((e) => e.dataset.uid).filter(Boolean))];
  if (!ids.length) return;
  const ps = await online.user.profiles(ids);
  els.forEach((e) => {
    const p = ps[e.dataset.uid];
    e.textContent = (p && p.name) || '名前のない参加者';
    if (e.dataset.uid === online.uid) e.textContent += '（あなた）';
  });
}

function mySolvedIds() {
  return Object.keys(store.stats).filter((id) => store.stats[id].everCorrect && byId(id));
}

// 自分の成績を scores/<id> に書く。同じ文書への書き込みは1つずつ
function syncScore() {
  if (!online.db || !online.uid) return;
  const ids = mySolvedIds();
  const body = {
    solved: ids.length,
    ids,
    points: ids.reduce((a, id) => a + (store.stats[id].best || 0), 0),
    wins: store.wins || 0,
    updatedAt: Date.now(),
  };
  writeChain = writeChain
    .then(() => online.db.doc('scores/' + online.uid).set(body))
    .then(() => { online.writeErr = null; })
    .catch((e) => { online.writeErr = e && e.code; refreshOnline(); });
}

// 別の端末で解いた分を取り込む（和集合）
async function mergeRemoteScore() {
  try {
    const snap = await online.db.doc('scores/' + online.uid).get();
    let changed = false;
    if (snap.exists) {
      const d = snap.data();
      (Array.isArray(d.ids) ? d.ids : []).forEach((id) => {
        if (typeof id !== 'string' || !byId(id)) return;
        const st = store.stats[id];
        if (!st || !st.everCorrect) {
          store.stats[id] = { tries: st ? st.tries : 0, correct: st ? st.correct : 0, best: st ? st.best : 0, ...st, everCorrect: true };
        }
      });
      if (typeof d.wins === 'number' && d.wins > (store.wins || 0)) store.wins = d.wins;
      saveStore();
      changed = !snap.exists || mySolvedIds().length !== d.solved || (store.wins || 0) !== d.wins;
    } else {
      changed = mySolvedIds().length > 0;
    }
    if (changed) syncScore();
  } catch (e) {}
}

function onlineStatusHtml() {
  if (!online.ready) return '<p class="hint">接続中…</p>';
  if (online.off || !online.db) return '<p class="hint">ランキング・投稿・対戦は claude.ai でこのページを開いたときに使える。</p>';
  if (!online.uid) return '<p class="hint">サインインすると成績がランキングに載る。</p>';
  const i = online.scores.findIndex((s) => s.id === online.uid);
  return `<p class="hint">${i >= 0 ? `あなたは ${i + 1} 位（${online.scores.length} 人中）` : 'まだランキングに載っていない。1問正解すると載る。'}${online.writeErr ? ' ・ 成績を保存できなかった（書き込み権限がない可能性がある）' : ''}</p>`;
}

// ---- A: ランキング ----
function rankListHtml() {
  if (!online.scores.length) return '<p class="hint">まだ誰も載っていない。</p>';
  const rows = [...online.scores].sort((a, b) => (b.solved || 0) - (a.solved || 0) || (b.points || 0) - (a.points || 0));
  let rank = 0, prev = null;
  return `<div class="tbl-wrap"><table class="key rank">
    <thead><tr><th>順位</th><th>名前</th><th>解いた問題</th><th>得点</th><th>対戦勝利</th></tr></thead>
    <tbody>${rows.map((r, i) => {
      const key = `${r.solved}/${r.points}`;
      if (key !== prev) { rank = i + 1; prev = key; }
      return `<tr class="${r.id === online.uid ? 'me' : ''}"><td class="mono">${rank}</td>
        <td><span data-uid="${esc(r.id)}">…</span></td>
        <td class="mono">${Number(r.solved) || 0}<span class="muted">/${DATA.problems.length}</span></td>
        <td class="mono">${Number(r.points) || 0}</td><td class="mono">${Number(r.wins) || 0}</td></tr>`;
    }).join('')}</tbody></table></div>`;
}

function renderRank() {
  $('#app').innerHTML = `
    <div class="stack">
      <div class="row"><button class="btn ghost" id="back">← 戻る</button></div>
      <h1>ランキング</h1>
      <p class="hint">正解したことのある問題の数で並べる（同数なら各問題の最高点の合計）。</p>
      ${online.db ? '<div id="rank-list"></div>' : onlineStatusHtml()}
    </div>`;

}

// ---- B: 意見投稿欄 ----
function allPosts() {
  const out = [];
  online.posts.forEach((d) => (Array.isArray(d.items) ? d.items : []).forEach((it) => {
    if (it && typeof it.text === 'string' && typeof it.at === 'number') out.push({ by: d.id, id: String(it.id), text: it.text.slice(0, POST_MAX), at: it.at });
  }));
  return out.sort((a, b) => b.at - a.at).slice(0, 200);
}

function postListHtml() {
  const ps = allPosts();
  if (!ps.length) return '<p class="hint">まだ投稿はない。</p>';
  const fmt = (t) => { const d = new Date(t); return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };
  return `<ul class="posts">${ps.map((p) => `<li>
    <div class="post-head"><b data-uid="${esc(p.by)}">…</b><span class="muted mono">${fmt(p.at)}</span>
      ${p.by === online.uid ? `<button class="btn ghost small" data-del="${esc(p.id)}">削除</button>` : ''}</div>
    <p>${esc(p.text)}</p></li>`).join('')}</ul>`;
}

let postDraft = '';
function renderPosts() {
  const canPost = online.db && online.uid;
  $('#app').innerHTML = `
    <div class="stack">
      <div class="row"><button class="btn ghost" id="back">← 戻る</button></div>
      <h1>みんなの意見</h1>
      <p class="hint">問題の感想、間違いの指摘、欲しい問題など。名前つきで全員に見える。</p>
      ${canPost ? `<div class="composer">
        <label for="post-text" class="eyebrow">投稿する（${POST_MAX}字まで）</label>
        <textarea id="post-text" maxlength="${POST_MAX}" rows="3"></textarea>
        <div class="row" style="justify-content:space-between"><span class="hint" id="post-msg"></span>
          <button class="btn primary" id="post-send">投稿</button></div>
      </div>` : onlineStatusHtml()}
      <div id="post-list"></div>
    </div>`;
  $('#back').onclick = () => show('home');
  const ta = $('#post-text');
  if (ta) {
    ta.value = postDraft;
    ta.oninput = () => { postDraft = ta.value; };
    $('#post-send').onclick = sendPost;
  }
  const el = $('#post-list');
  el.innerHTML = postListHtml();
  fillNames(el);
  bindPostDeletes();
}

function myItems() {
  const d = online.posts.find((p) => p.id === online.uid);
  return d && Array.isArray(d.items) ? d.items.filter((it) => it && typeof it.text === 'string') : [];
}

async function writeMyPosts(items, msgOk) {
  const btn = $('#post-send');
  if (btn) btn.disabled = true;
  try {
    await (writeChain = writeChain.then(() => online.db.doc('posts/' + online.uid).set({ items })));
    if ($('#post-msg')) $('#post-msg').textContent = msgOk;
    return true;
  } catch (e) {
    if ($('#post-msg')) $('#post-msg').textContent = '保存できなかった。このページへの書き込み権限がない可能性がある。';
    writeChain = Promise.resolve();
    return false;
  } finally {
    if (btn) btn.disabled = false;
  }
}

async function sendPost() {
  const text = postDraft.trim();
  if (!text) { $('#post-msg').textContent = '何か書いてから投稿する。'; return; }
  const items = myItems().slice(-49);
  items.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), text: text.slice(0, POST_MAX), at: Date.now() });
  if (await writeMyPosts(items, '投稿した。')) {
    postDraft = '';
    const ta = $('#post-text');
    if (ta) ta.value = '';
  }
}

function bindPostDeletes() {
  document.querySelectorAll('[data-del]').forEach((b) => {
    b.onclick = () => writeMyPosts(myItems().filter((it) => String(it.id) !== b.dataset.del), '削除した。');
  });
}

// ---- C: 早解き対戦 ----
const race = { rm: null, code: '', peers: [], round: null, ids: [], idx: 0, startAt: 0, penalty: 0, wrong: new Set(), finished: null, counted: false, msg: '' };

function raceCode() {
  const cs = 'abcdefghjkmnpqrstuvwxyz23456789';
  return Array.from({ length: 4 }, () => cs[Math.floor(Math.random() * cs.length)]).join('');
}

async function joinRace(code) {
  code = String(code || '').toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 8);
  if (!code) { race.msg = '部屋コードを入れる。'; render(); return; }
  if (isNight()) { checkNight(); return; }
  try {
    if (race.rm) await race.rm.leave();
    const rm = await online.room.join('race-' + code);
    Object.assign(race, { rm, code, round: null, peers: rm.peers(), msg: '' });
    rm.onPeers((ch) => { race.peers = ch.peers; racePeersChanged(); });
    rm.on('start', (m) => onRaceStart(m.data));
    rm.presence({ uid: online.uid, round: null, idx: 0, done: null, pen: 0 });
    show('race');
  } catch (e) {
    race.msg = '部屋に入れなかった。少し待ってからもう一度。';
    render();
  }
}

async function leaveRace() {
  if (race.rm) { try { await race.rm.leave(); } catch (e) {} }
  race.rm = null;
  race.round = null;
  show('home');
}

function startRace() {
  const pool = DATA.problems.filter((p) => p.mode === 'narrow');
  const ids = [];
  while (ids.length < RACE_LEN && ids.length < pool.length) {
    const p = pool[Math.floor(Math.random() * pool.length)];
    if (!ids.includes(p.id)) ids.push(p.id);
  }
  // 自分の画面も、戻ってきた自分の発信（エコー）で始める
  race.rm.emit('start', { round: Date.now().toString(36), ids }).catch(() => {
    race.msg = '開始の合図を送れなかった。';
    render();
  });
}

function onRaceStart(data) {
  if (!data || typeof data.round !== 'string' || !Array.isArray(data.ids)) return;
  const ids = data.ids.filter((id) => typeof id === 'string' && byId(id) && byId(id).mode === 'narrow').slice(0, 10);
  if (!ids.length || isNight()) return;
  Object.assign(race, { round: data.round.slice(0, 20), ids, idx: 0, startAt: Date.now() + 3000, penalty: 0, wrong: new Set(), finished: null, counted: false });
  race.rm.presence({ uid: online.uid, round: race.round, idx: 0, done: null, pen: 0 });
  show('raceplay');
}

function raceElapsed() {
  return Math.max(0, (race.finished !== null ? race.finished : Date.now() - race.startAt + race.penalty));
}
const fmtSec = (ms) => (ms / 1000).toFixed(1) + ' 秒';

function racePlayers() {
  return race.peers.filter((p) => p.kind === 'viewer').map((p) => ({
    peer: p.peer,
    uid: p.by || (typeof p.presence.uid === 'string' ? p.presence.uid : ''),
    isMe: p.sameTab,
    round: p.presence.round,
    idx: Number(p.presence.idx) || 0,
    done: typeof p.presence.done === 'number' ? p.presence.done : null,
  }));
}

function raceBoardHtml() {
  const ps = racePlayers().filter((p) => p.round === race.round);
  ps.sort((a, b) => (a.done ?? Infinity) - (b.done ?? Infinity) || b.idx - a.idx);
  return ps.map((p, i) => `<div class="racer ${p.isMe ? 'me' : ''}">
    <span class="mono">${p.done !== null ? i + 1 : '–'}</span>
    <span class="rname" data-uid="${esc(p.uid)}">…</span>
    <span class="rbar"><span style="width:${Math.min(100, (100 * (p.done !== null ? race.ids.length : p.idx)) / race.ids.length)}%"></span></span>
    <span class="mono">${p.done !== null ? fmtSec(p.done) : `${p.idx}/${race.ids.length}`}</span></div>`).join('');
}

function racePeersChanged() {
  if (view.screen === 'race') { const el = $('#lobby'); if (el) { el.innerHTML = lobbyHtml(); fillNames(el); } }
  if (view.screen === 'raceplay') { const el = $('#board'); if (el) { el.innerHTML = raceBoardHtml(); fillNames(el); } checkRaceWin(); }
}

function lobbyHtml() {
  const ps = racePlayers();
  return `<ul class="lobby">${ps.map((p) => `<li><span data-uid="${esc(p.uid)}">…</span>${p.isMe ? '' : ''}</li>`).join('')}</ul>
    <p class="hint">${ps.length} 人がこの部屋にいる。</p>`;
}

function renderRaceHome() {
  const can = online.room && online.uid;
  if (!race.rm) {
    $('#app').innerHTML = `
      <div class="stack">
        <div class="row"><button class="btn ghost" id="back">← 戻る</button></div>
        <h1>早解き対戦</h1>
        <p class="hint">同じ ${RACE_LEN} 問を同時に解き、全問正解までの時間を競う。手がかりは最初から全部見えている。誤答は +${RACE_PENALTY / 1000} 秒。</p>
        ${can ? `<section class="panel">
          <button class="btn primary" id="create">部屋を作る</button>
          <div class="row"><input id="code" class="codein" inputmode="latin" autocomplete="off" maxlength="8" placeholder="部屋コード">
            <button class="btn" id="join">参加</button></div>
          <p class="hint">${esc(race.msg)}</p>
        </section>` : onlineStatusHtml()}
      </div>`;
    $('#back').onclick = () => show('home');
    if (can) {
      $('#create').onclick = () => joinRace(raceCode());
      $('#join').onclick = () => joinRace($('#code').value);
    }
    return;
  }
  $('#app').innerHTML = `
    <div class="stack">
      <div class="row"><button class="btn ghost" id="leave">← 部屋を出る</button></div>
      <h1>対戦の部屋</h1>
      <div class="codebox"><span class="eyebrow">部屋コード</span><span class="mono big">${esc(race.code)}</span>
        <span class="hint">友達にこのコードを伝える</span></div>
      <div id="lobby"></div>
      <div class="row"><button class="btn primary" id="go">${RACE_LEN}問でスタート</button></div>
      <p class="hint">誰が押してもこの部屋の全員が同時に始まる。 ${esc(race.msg)}</p>
    </div>`;
  $('#leave').onclick = leaveRace;
  $('#go').onclick = startRace;
  const el = $('#lobby');
  el.innerHTML = lobbyHtml();
  fillNames(el);
}

function renderRacePlay() {
  const wait = Date.now() < race.startAt;
  const p = byId(race.ids[race.idx]);
  const done = race.finished !== null;
  $('#app').innerHTML = `
    <div class="stack">
      <div class="row" style="justify-content:space-between">
        <button class="btn ghost" id="leave">← 部屋に戻る</button>
        <span class="mono big" id="race-timer">${wait ? '' : fmtSec(raceElapsed())}</span>
      </div>
      <div id="board" class="board"></div>
      ${wait ? `<div class="countdown mono" id="count">${Math.ceil((race.startAt - Date.now()) / 1000)}</div>`
      : done ? `<div class="verdict ok"><h2>完走</h2><span class="score">${fmtSec(race.finished)}（誤答 ${race.penalty / RACE_PENALTY} 回を含む）</span></div>
          <div class="row"><button class="btn primary" id="again">部屋に戻る</button></div>`
      : `<div class="board-head"><div><span class="eyebrow">${race.idx + 1} / ${race.ids.length} 問目</span>
            <div class="formula">${fmtFormula(p.formula)}</div></div></div>
          <div class="deck">${p.clues.map((c) => `<div class="clue open"><span class="cname">${esc(DATA.cards[c.card].name)}</span>${resultHtml(c.card, c.result)}</div>`).join('')}</div>
          <p class="hint">正解の構造をタップ。</p>
          <section class="cands" id="rcands">${p.candidates.map((s, i) => `
            <button class="cand pick ${race.wrong.has(i) ? 'struck' : ''}" data-pick="${i}" ${race.wrong.has(i) ? 'disabled' : ''}>
              <div class="mol">${molSvg(s)}</div><div class="bar"><span class="tag">${letter(i)}</span></div></button>`).join('')}</section>`}
    </div>`;
  $('#leave').onclick = () => show('race');
  const ag = $('#again');
  if (ag) ag.onclick = () => show('race');
  const rc = $('#rcands');
  if (rc) rc.onclick = (e) => { const b = e.target.closest('[data-pick]'); if (b) racePick(+b.dataset.pick); };
  const el = $('#board');
  el.innerHTML = raceBoardHtml();
  fillNames(el);
}

function racePick(i) {
  const p = byId(race.ids[race.idx]);
  if (i === p.answer) {
    race.idx++;
    race.wrong = new Set();
    if (race.idx >= race.ids.length) race.finished = Date.now() - race.startAt + race.penalty;
  } else {
    race.penalty += RACE_PENALTY;
    race.wrong.add(i);
  }
  race.rm.presence({ uid: online.uid, round: race.round, idx: race.idx, done: race.finished, pen: race.penalty });
  render();
  checkRaceWin();
}

// 部屋の全員が完走し、自分が最速なら勝利を1つ数える（1ラウンド1回）
function checkRaceWin() {
  if (race.counted || race.finished === null) return;
  const ps = racePlayers().filter((p) => p.round === race.round);
  if (ps.length < 2 || ps.some((p) => p.done === null)) return;
  race.counted = true;
  const best = Math.min(...ps.map((p) => p.done));
  if (race.finished <= best) {
    store.wins = (store.wins || 0) + 1;
    saveStore();
    syncScore();
  }
}

setInterval(() => {
  if (view.screen !== 'raceplay') return;
  if (Date.now() < race.startAt) { const c = $('#count'); if (c) c.textContent = Math.ceil((race.startAt - Date.now()) / 1000); return; }
  if ($('#count')) { render(); return; }
  const t = $('#race-timer');
  if (t && race.finished === null) t.textContent = fmtSec(raceElapsed());
}, 100);

function render() {
  const s = view.screen;
  if (s === 'play' && game && game.p) renderPlay();
  else if (s === 'result' && game && game.done) renderResult();
  else if (s === 'split' && game && game.split) renderSplit();
  else if (s === 'given' && game && game.big) renderGiven();
  else if (s === 'bigdone' && game && game.big) renderBigDone();
  else if (s === 'calc' && game && game.calc) renderCalc();
  else if (s === 'rank') renderRank();
  else if (s === 'posts') renderPosts();
  else if (s === 'race') renderRaceHome();
  else if (s === 'raceplay' && race.rm && race.round) renderRacePlay();
  else if (s === 'count' && game && game.count) renderCount();
  else renderHome();
}

if (!DATA) {
  $('#app').innerHTML = '<p>問題データがない。<code>npm run build</code> で dist/index.html を作る。</p>';
} else {
  checkNight();
  setInterval(checkNight, 30000);
  render();
  initOnline().catch(() => { online.ready = true; online.off = true; refreshOnline(); });
}
</script>
