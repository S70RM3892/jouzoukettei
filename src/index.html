<title>有機構造決定パズル</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 京大の問題冊子にそろえる: 白い紙に細い黒の明朝。採点の印だけ朱。色の面は使わず、罫線と余白で区切る */
:root {
  color-scheme: light;
  --ground: #ffffff;
  --surface: #ffffff;
  --paper: #ffffff;
  --ink: #111111;
  --muted: #555555;
  --line: #cfcfcf;
  --rule: #111111;
  --accent: #111111;
  --accent-ink: #ffffff;
  --accent-soft: #f3f3f3;
  --pos: #b3261e;
  --pos-soft: #ffffff;
  --ok: #1f5f36;
  --ok-soft: #ffffff;
  --warn: #7a520c;
  --warn-soft: #ffffff;
  --redpen: #c8322a;
  --grid: transparent;
  --g1: #a6a6a6; --g2: #8c8c8c; --g3: #707070; --g4: #525252; --g5: #333333; --g6: #111111;
  --shadow: none;
  --mol-filter: none;
  --f-display: "Noto Serif JP", "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", serif;
  --f-body: "Noto Serif JP", "Hiragino Mincho ProN", "Yu Mincho", "YuMincho", serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background: #ffffff;
  color: var(--ink);
  font: 300 15px/1.8 var(--f-body);
  -webkit-text-size-adjust: 100%;
}
.wrap { max-width: 760px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 120px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.3; }
h1 { font-size: 2.1rem; font-weight: 500; letter-spacing: 0.04em; }
h2 { font-size: 1.1rem; font-weight: 500; letter-spacing: 0.03em; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.eyebrow { font-size: 0.75rem; letter-spacing: 0.12em; color: var(--muted); font-weight: 500; }
.muted { color: var(--muted); }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.formula { font-family: var(--f-mono); font-weight: 500; letter-spacing: 0.02em; }
.formula sub { font-size: 0.68em; vertical-align: -0.25em; line-height: 0; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

.btn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 10px;
  padding: 10px 16px; cursor: pointer; font-weight: 500; min-height: 44px;
}
.btn:hover { border-color: var(--muted); }
.btn { transition: transform 0.12s ease, box-shadow 0.12s ease, border-color 0.12s ease; }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--paper); border-color: var(--ink); color: var(--ink); }
.btn.primary:hover { background: var(--accent-soft); }
.btn.primary:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.ghost { background: transparent; border-color: transparent; padding-inline: 8px; }
.chip {
  border: 1px solid var(--line); background: transparent; border-radius: 999px;
  padding: 6px 14px; cursor: pointer; font-size: 0.9rem; min-height: 36px;
}
.chip[aria-pressed="true"] { background: var(--ink); color: var(--ground); border-color: var(--ink); }
.chip:disabled { opacity: 0.5; cursor: not-allowed; }
.chip small { font-size: 0.72rem; margin-left: 4px; }

/* ---------- 難易度（6段） ---------- */
.grade { display: inline-flex; align-items: center; gap: 6px; font-size: 0.74rem; font-weight: 500; letter-spacing: 0.04em; color: var(--gc); white-space: nowrap; }
.grade .pips { display: inline-flex; gap: 2px; }
.grade .pips i { width: 5px; height: 12px; border-radius: 1px; background: var(--line); }
.grade .pips i.on { background: var(--gc); }
.gchip[aria-pressed="true"] { background: var(--gc, var(--ink)); border-color: var(--gc, var(--ink)); color: var(--paper); }
.gchip { border-color: color-mix(in srgb, var(--gc, var(--line)) 45%, var(--line)); }
.g1 { --gc: var(--g1); } .g2 { --gc: var(--g2); } .g3 { --gc: var(--g3); } .g4 { --gc: var(--g4); } .g5 { --gc: var(--g5); } .g6 { --gc: var(--g6); }
.gscale { display: grid; grid-template-columns: repeat(6, 1fr); gap: 3px; margin-top: 4px; }
.gscale span { height: 6px; border-radius: 2px; background: var(--gc); }
.gscale-l { display: flex; justify-content: space-between; font-size: 0.7rem; color: var(--muted); }

/* ---------- 表紙 ---------- */
.cover { background: var(--paper); border: 1px solid var(--line); box-shadow: var(--shadow); border-radius: 4px; padding: 18px 18px 16px; position: relative; overflow: hidden; }
.cover::before { content: ""; position: absolute; inset: 8px; border: 3px double var(--rule); border-radius: 2px; pointer-events: none; opacity: 0.55; }
.cover .kicker { font-family: var(--f-display); font-weight: 500; letter-spacing: 0.3em; font-size: 0.82rem; color: var(--muted); }
.cover h1 { font-size: clamp(2rem, 8vw, 3rem); line-height: 1.15; margin-top: 6px; color: var(--ink); }
.cover h1 em { font-style: normal; color: var(--accent); }
.cover p { margin: 8px 0 0; max-width: 32em; color: var(--muted); font-size: 0.92rem; }
.cover .seal { position: absolute; right: 16px; top: 16px; width: 64px; height: 64px; border: 2px solid var(--redpen); color: var(--redpen); border-radius: 50%;
  display: grid; place-items: center; font-family: var(--f-display); font-weight: 500; font-size: 0.72rem; line-height: 1.15; text-align: center; transform: rotate(-12deg); opacity: 0.85; }
.today { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--gc, var(--accent)); border-radius: 4px; padding: 12px 14px; }
.today .t { font-family: var(--f-display); font-weight: 500; font-size: 1.05rem; }
.today .s { font-size: 0.8rem; color: var(--muted); }

/* ---------- Home ---------- */
.masthead { display: grid; gap: 6px; padding-block: 12px 4px; }
.masthead p { margin: 0; max-width: 34em; color: var(--muted); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.stat b { display: block; font-family: var(--f-mono); font-size: 1.35rem; font-variant-numeric: tabular-nums; }
.stat span { font-size: 0.78rem; color: var(--muted); }
.panel { display: grid; gap: 10px; }
.weak-list { display: flex; flex-wrap: wrap; gap: 6px; }
.weak { background: var(--warn-soft); color: var(--warn); border-radius: 6px; padding: 3px 10px; font-size: 0.85rem; font-weight: 500; }
.plist { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.plist li { border-bottom: 1px solid var(--line); }
.plist button {
  width: 100%; display: grid; grid-template-columns: 3.2em 1fr auto; gap: 12px; align-items: center;
  background: none; border: 0; padding: 12px 4px; cursor: pointer; text-align: left; min-height: 52px;
}
.plist button:hover { background: var(--surface); }
.plist li { border-left: 3px solid var(--gc, transparent); }
.plist .num { font-family: var(--f-mono); color: var(--muted); font-size: 0.85rem; }
.plist .fm { font-size: 1.1rem; }
.lv { color: var(--warn); letter-spacing: 1px; font-size: 0.8rem; margin-left: 8px; }
.badge { font-size: 0.78rem; font-weight: 500; border-radius: 6px; padding: 2px 8px; font-variant-numeric: tabular-nums; }
.badge.ok { background: var(--ok-soft); color: var(--ok); }
.badge.ng { background: var(--pos-soft); color: var(--pos); }
.badge.new { color: var(--muted); border: 1px dashed var(--line); }

/* ---------- Board ---------- */
.board-head {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--ground); padding-block: 8px 10px; border-bottom: 1px solid var(--line);
  display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 8px;
}
.board-head .formula { font-size: 2.1rem; line-height: 1.1; }
.meter { text-align: right; font-size: 0.85rem; color: var(--muted); }
.meter b { font-family: var(--f-mono); font-size: 1.15rem; color: var(--ink); font-variant-numeric: tabular-nums; }
.hint { font-size: 0.88rem; color: var(--muted); margin: 0; }

.cands { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (min-width: 620px) { .cands { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.cand {
  position: relative; background: var(--paper); border: 1px solid var(--line); border-radius: 12px;
  box-shadow: var(--shadow); touch-action: pan-y; user-select: none; -webkit-user-select: none;
  transition: transform 0.18s ease, opacity 0.18s ease; overflow: hidden;
}
.cand.dragging { transition: none; }
.cand .mol { padding: 6px 6px 0; }
.mol svg { display: block; width: 100%; height: auto; filter: var(--mol-filter); }
.cand .bar { display: flex; justify-content: space-between; align-items: center; padding: 0 6px 6px 10px; }
.cand .tag { font-family: var(--f-mono); font-size: 0.8rem; color: var(--muted); }
.x-btn {
  border: 1px solid var(--line); background: var(--surface); border-radius: 8px;
  min-width: 44px; min-height: 36px; cursor: pointer; font-weight: 500; font-size: 0.85rem;
}
.cand.struck { opacity: 0.38; }
.cand.struck .mol { filter: grayscale(1); }
.cand.struck::after {
  content: ""; position: absolute; left: 8%; right: 8%; top: 44%; height: 2px;
  background: var(--pos); transform: rotate(-12deg); pointer-events: none;
}
.cand.struck .x-btn { opacity: 1; }
.cand.chosen { outline: 3px solid var(--accent); outline-offset: -3px; }

.deck { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (min-width: 620px) { .deck { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.clue {
  border: 1px solid var(--line); border-radius: 12px; background: var(--surface);
  padding: 12px; text-align: left; cursor: pointer; display: grid; gap: 6px; align-content: start; min-height: 96px;
}
.clue .cname { font-family: var(--f-display); font-weight: 500; font-size: 1rem; }
.clue .act { font-size: 0.8rem; color: var(--muted); line-height: 1.45; }
.clue.closed {
  background:
    repeating-linear-gradient(135deg, transparent 0 9px, color-mix(in srgb, var(--line) 55%, transparent) 9px 10px),
    var(--surface);
}
.clue.closed .res { font-size: 0.8rem; color: var(--accent); font-weight: 500; }
.clue.open { cursor: default; background: var(--paper); border-color: var(--ink); }
.clue .res { font-weight: 500; }
.res.pos { color: var(--pos); }
.res.neg { color: var(--muted); }
.res.num { font-family: var(--f-mono); font-size: 1.1rem; }
.products { display: flex; flex-wrap: wrap; gap: 6px; }
.prod { flex: 1 1 110px; min-width: 0; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); padding: 4px; }
.prod .pn { font-size: 0.75rem; text-align: center; color: var(--muted); }
.clue.wide { grid-column: 1 / -1; }

.dock {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  background: color-mix(in srgb, var(--ground) 92%, transparent);
  backdrop-filter: blur(8px); border-top: 1px solid var(--line);
  padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px));
}
.dock-in { max-width: 760px; margin: 0 auto; display: flex; gap: 10px; align-items: center; justify-content: space-between; }
.dock-in .hint { flex: 1; }

/* ---------- Result ---------- */
.verdict { display: grid; gap: 4px; padding: 16px; border-radius: 14px; }
.verdict.ok { background: var(--ok-soft); color: var(--ok); }
.verdict.ng { background: var(--pos-soft); color: var(--pos); }
.verdict h2 { font-size: 1.6rem; font-weight: 500; }
.verdict .score { font-family: var(--f-mono); font-size: 1rem; }
.pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.clue .infer { display: block; margin-top: 6px; padding: 6px 8px; border-radius: 8px; background: var(--accent-soft); color: var(--ink); font-size: 0.82rem; line-height: 1.5; text-align: left; }
.clue .infer b { display: block; font-size: 0.7rem; color: var(--accent); letter-spacing: 0.06em; }
.exam .sheet { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
.exam .grp { font-size: 0.9rem; margin: 14px 0 4px; color: var(--muted); letter-spacing: 0.04em; }
.exam .exps { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.exam .exps li { line-height: 1.7; }
.exam .lab { font-weight: 500; margin-right: 2px; }
.exam .figs { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0; }
.exam .fig { width: 132px; border: 1px solid var(--line); border-radius: 10px; padding: 4px; background: var(--surface); }
.exam .fig .pn, .exam .opt .pn { display: block; font-size: 0.72rem; color: var(--muted); text-align: center; line-height: 1.3; min-height: 1.3em; }
.exam .hintbtn { margin-top: 4px; font: inherit; font-size: 0.78rem; color: var(--accent); background: none; border: 1px dashed var(--accent); border-radius: 999px; padding: 2px 10px; cursor: pointer; }
.exam .hinttx { margin: 6px 0 0; padding: 8px 10px; background: var(--accent-soft); border-radius: 8px; font-size: 0.86rem; line-height: 1.6; }
.exam .q { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
.exam .q.ok { border-color: var(--ok); background: var(--ok-soft); }
.exam .q.part { border-color: var(--warn); background: var(--warn-soft); }
.exam .q.ng { border-color: var(--pos); background: var(--pos-soft); }
.exam .qhead { display: flex; justify-content: space-between; align-items: baseline; }
.exam .qhead b { font-family: var(--f-display); font-size: 1.15rem; letter-spacing: 0.06em; }
.exam .q { position: relative; }
.exam .stamp { position: absolute; right: 64px; top: 2px; font-family: var(--f-display); font-weight: 500; font-size: 2.6rem; line-height: 1; color: var(--redpen); opacity: 0.85; transform: rotate(-8deg); pointer-events: none; }
.exam .sheet { box-shadow: var(--shadow); border-radius: 4px; }
.exam .grp { font-family: var(--f-display); font-weight: 500; color: var(--ink); border-bottom: 1px solid var(--line); padding-bottom: 2px; }
.exam .q.ok, .exam .q.part, .exam .q.ng { background: var(--paper); }
.exam .qhead .pts { font-family: var(--f-mono); font-size: 0.8rem; color: var(--muted); }
.exam .qp { margin: 6px 0 10px; line-height: 1.7; }
.exam input.ans { font: inherit; font-size: 1.05rem; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); color: var(--ink); width: 11em; max-width: 100%; }
.exam .numrow input.ans { width: 6em; }
.exam .optgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 6px; }
.exam .optgrid.wide { grid-template-columns: 1fr; }
.exam .opt { font: inherit; background: var(--paper); border: 2px solid var(--line); border-radius: 10px; padding: 3px; cursor: pointer; color: var(--ink); }
.exam .opt.sel { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.exam .opt.right { border-color: var(--ok); }
.exam .opt.wrong { border-color: var(--pos); }
.exam .chip.right { border-color: var(--ok); }
.exam .rules { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; background: var(--surface); font-size: 0.9rem; line-height: 1.7; }
.exam .rules p { margin: 6px 0 0; }
.exam .rules .rn { font-weight: 500; margin-right: 4px; }
.exam .assign { display: grid; gap: 8px; }
.exam .arow { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.exam .arow > b { min-width: 1.5em; }
.exam textarea.ans { font: inherit; width: 100%; box-sizing: border-box; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); color: var(--ink); }
.exam .selfgrade { margin-top: 8px; gap: 6px; align-items: center; }
.exam .chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.exam .expl { margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--line); font-size: 0.88rem; line-height: 1.7; }
.exam .expl p { margin: 4px 0; }
.molcard { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 6px; }
.molcard .cap { font-size: 0.8rem; padding: 0 6px 4px; }
.molcard .cap b { display: block; font-size: 0.72rem; letter-spacing: 0.08em; color: var(--muted); }
.notes { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.notes li { border-left: 3px solid var(--pos); background: var(--surface); padding: 8px 12px; border-radius: 0 8px 8px 0; font-size: 0.92rem; }
.notes li.warn { border-left-color: var(--warn); }
.notes li.good { border-left-color: var(--ok); }
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
table.key { border-collapse: collapse; font-size: 0.82rem; min-width: 100%; }
table.key th, table.key td { padding: 7px 10px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
table.key thead th { font-size: 0.75rem; color: var(--muted); font-weight: 500; }
table.key tr.ans td:first-child { font-weight: 500; color: var(--ok); }
table.key td.bad { background: var(--pos-soft); color: var(--pos); font-weight: 500; }
table.key td.hid { color: var(--muted); }

/* ---------- Big / Count ---------- */
.progress { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 0.82rem; }
.step { border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; color: var(--muted); }
.step.done { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.step.now { background: var(--ink); color: var(--ground); border-color: var(--ink); font-weight: 500; }
.arrow { color: var(--muted); font-size: 0.75rem; }
.story { margin: 0; max-width: 40em; }
.solved { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); padding: 8px 12px; }
.solved summary { cursor: pointer; font-weight: 500; font-size: 0.9rem; min-height: 32px; display: flex; align-items: center; }
.solved-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; padding-top: 8px; }
.btn.right { background: var(--ok); border-color: var(--ok); color: var(--paper); }
.btn.wrong { background: var(--pos); border-color: var(--pos); color: var(--paper); }
#opts .btn { min-width: 52px; font-family: var(--f-mono); font-size: 1.1rem; }
.eq { font-size: 0.95rem; overflow-wrap: anywhere; }
.xcard { max-width: 420px; }
.stepper { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
  border-bottom: 1px solid var(--line); padding-block: 8px; }
.stepper output { font-size: 1.6rem; min-width: 2.2em; text-align: center; font-variant-numeric: tabular-nums; }
.stepper .btn { min-width: 48px; font-size: 1.2rem; }
.conds { margin: 0; padding-left: 1.2em; display: grid; gap: 6px; }
.cands.one { grid-template-columns: minmax(0, 1fr); max-width: 520px; }
.cand.hit { border-color: var(--ok); box-shadow: 0 0 0 2px var(--ok-soft); }
.cand.miss { opacity: 0.55; }
.cap2 { gap: 6px; font-size: 0.78rem; align-items: flex-start; }
.why { color: var(--muted); font-size: 0.72rem; text-align: right; }
.plist .sub { font-size: .8rem; margin-left: 6px; }

/* ---------- Online ---------- */
table.rank tr.me td { background: var(--accent-soft); font-weight: 500; }
.composer { display: grid; gap: 8px; }
.composer textarea { width: 100%; font: inherit; color: var(--ink); background: var(--paper); border: 1px solid var(--line);
  border-radius: 10px; padding: 10px 12px; resize: vertical; }
.posts { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.posts li { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; }
.posts p { margin: 4px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.post-head { display: flex; gap: 10px; align-items: center; font-size: 0.85rem; }
.btn.small { min-height: 32px; padding: 4px 10px; font-size: 0.8rem; }
.post-head .small { min-height: 32px; padding: 4px 8px; margin-left: auto; font-size: 0.8rem; }
.namerow { align-items: center; }
.sacname { font-family: var(--f-mono); font-size: 0.85rem; margin-right: auto; margin-left: 8px; }
.klist { display: grid; gap: 6px; }
.kt { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; text-align: left; font: inherit; color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; cursor: pointer; }
.kt small { grid-column: 1 / -1; color: var(--muted); font-size: 0.75rem; }
.kt[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 3px 0 0 var(--ink); }
.kq { font-size: 1.1rem; line-height: 1.6; }

  </div>

<script>/*__SMILES_LITE__*/</script>
<script>
const DATA = /*__PUZZLE_DATA__*/null;
const ONLINE_CONFIG = /*__ONLINE_CONFIG__*/null; // GitHub Pages 版のオンライン機能（Firebase）の設定。ビルド時に入る
const PER_CARD = 10;      // 最少枚数を超えて開いた手がかり1枚ごとの減点
const PER_GUESS = 10;     // 根拠なしで消した候補1つごとの減点
const NIGHT_FROM = 23, NIGHT_UNTIL = 5;
const STORE_KEY = 'jouzoukettei.v1';
const MODES = [
  { key: 'k26', name: '京大2026型（規則・逆算・量的）', note: '(a) 問題文で定義された規則をその場で読んで適用し、構造式を書く → 分子式と反応性から逆算する。(b) 光学分割を物質量・質量・有効数字で計算する。規則は画面の端に固定して表示する。構造式は SMILES で書く（書き方は入力欄の下）' },
  { key: 'gen', name: '京大形式（本番レベル）', note: '京大の過去問の答え 11 題の再現と、基礎から京大超えまで6段階の自動生成の大問。化合物どうしの関係を使う問題が中心' },
  { key: 'big', name: '京大形式（基本）', note: '手作りの大問を京大形式で。問題文と実験を全部読んでから、問1〜に答える' },
  { key: 'narrow', name: '絞り込み型', note: '断片1つを決める' },
  { key: 'sugar', name: '糖の構造決定', note: '二糖・三糖を、還元性・加水分解の生成物・メチル化分析・酵素（マルターゼ・インベルターゼ・ラクターゼ・セロビアーゼ）の組み合わせで決める。α と β、グルコースとガラクトースは立体でしか区別できないので、構造式のくさび形の線をよく見る' },
  { key: 'survey', name: '異性体俯瞰型', note: '分子式の構造異性体を環・三重結合まで全部挙げてから、性質と反応の組み合わせで1つに決める。難易度は候補の数と手がかりの数で3段階。候補を見る前に、分子式の異性体を紙に全部書き出してから始める' },
  { key: 'count', name: '数え上げ型', note: '異性体を数える' },
  { key: 'polymer', name: '高分子型', note: '重合度を計算し、単量体を決める' },
];

// ---------- 記録 ----------
function loadStore() {
  try {
    const s = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
    if (s && s.stats && s.weak && s.history) return { qstat: {}, cardMiss: {}, daily: {}, know: {}, ...s };
  } catch (e) {}
  return { stats: {}, weak: {}, history: [], qstat: {}, cardMiss: {}, daily: {}, know: {} };
}
function saveStore() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch (e) {}
}
let store = loadStore();

function record(id, correct, score) {
  const st = store.stats[id] || { tries: 0, correct: 0, best: 0, everCorrect: false };
  st.tries++;
  if (correct) { st.correct++; st.everCorrect = true; st.best = Math.max(st.best, score); }
  st.lastCorrect = correct;
  store.stats[id] = st;
  store.history.push({ id, correct, score, at: Date.now() });
  store.history = store.history.slice(-200);
  saveStore();
  if (correct) syncScore();
  syncMistakes();
}
const bump = (card, d) => {
  store.weak[card] = Math.max(0, (store.weak[card] || 0) + d);
  if (d > 0) store.cardMiss[card] = (store.cardMiss[card] || 0) + d; // みんなの間違いに出す回数（減らさない）
};

// ---------- 小道具 ----------
const $ = (sel, root = document) => root.querySelector(sel);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmtFormula = (f) => esc(f).replace(/(\d+)/g, '<sub>$1</sub>');
const stars = (n) => '★'.repeat(n) + '☆'.repeat(3 - n);
// 難易度の6段（基礎・標準・京大下位・京大平均・京大上位・京大超え）
const GRADE_NAMES = (DATA && DATA.grades) || ['基礎', '標準', '京大下位', '京大平均', '京大上位', '京大超え'];
const gradeOfP = (p) => p.grade || p.level || 1;
function gradeBadge(pOrG) {
  const g = typeof pOrG === 'number' ? pOrG : gradeOfP(pOrG);
  return `<span class="grade g${g}" title="難易度 ${g}/6"><span class="pips">${[1, 2, 3, 4, 5, 6].map((i) => `<i class="${i <= g ? 'on' : ''}"></i>`).join('')}</span>${esc(GRADE_NAMES[g - 1])}</span>`;
}
const molName = (s) => { const m = DATA.molecules[s]; return (m && (m.name || (m.formula && m.formula.replace(/\d+/g, (d) => [...d].map((x) => '₀₁₂₃₄₅₆₇₈₉'[x]).join(''))))) || s; };
const molSvg = (s) => DATA.molecules[s].svg;
const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
const letter = (i) => String.fromCharCode(0x2460 + i); // ① ② ③ …
const unit = (card) => (card === 'chiral' ? '個' : '種類');
const poolLoaded = {}; // 条件を指定して読み込んだ問題（一覧・ランキングには入れない）
const byId = (id) => DATA.problems.find((p) => p.id === id) || poolLoaded[id];
const inMain = (id) => DATA.problems.some((p) => p.id === id);

function resultText(card, r) {
  const c = DATA.cards[card];
  if (c.kind === 'bool') return r ? c.yes : c.no;
  if (c.kind === 'count') return `${r} ${unit(card)}`;
  if (c.kind === 'contains') return r ? `${molName(r)} ${c.yes}` : `その化合物${c.no}`;
  if (!r.length) return c.none;
  return r.map(molName).join(' ＋ ');
}
function resultHtml(card, r) {
  const c = DATA.cards[card];
  if (c.kind === 'bool') return `<span class="res ${r ? 'pos' : 'neg'}">${esc(r ? c.yes : c.no)}</span>`;
  if (c.kind === 'count') return `<span class="res num">${r} ${unit(card)}</span>`;
  if (c.kind === 'contains') {
    return `<span class="res">次の化合物${esc(c.yes)}</span><div class="products"><div class="prod"><div class="mol">${molSvg(r)}</div><div class="pn">${esc(molName(r))}</div></div></div>`;
  }
  if (!r.length) return `<span class="res neg">${esc(c.none)}</span>`;
  return `<span class="res">生成物</span><div class="products">${r.map((s) =>
    `<div class="prod"><div class="mol">${molSvg(s)}</div><div class="pn">${esc(molName(s))}</div></div>`).join('')}</div>`;
}

function isNight(d = new Date()) {
  const h = d.getHours();
  return h >= NIGHT_FROM || h < NIGHT_UNTIL;
}
function checkNight() {
  const now = new Date();
  $('#night-clock').textContent = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
  $('#night').hidden = !isNight(now);
}

// ---------- 出題 ----------
let view = { screen: 'home', level: 0, mode: 'gen' };
let game = null;

function accuracy(n = 20) {
  const h = store.history.slice(-n);
  if (!h.length) return null;
  return Math.round((100 * h.filter((x) => x.correct).length) / h.length);
}

function cardsOf(p) {
  if (p.stages) return p.stages.flatMap((s) => s.clues || []).map((c) => c.card);
  return p.clues.map((c) => c.card);
}

function pickProblem(level, avoidId) {
  const inMode = DATA.problems.filter((p) => p.mode === view.mode);
  const pool = inMode.filter((p) => (!level || gradeOfP(p) === level) && p.id !== avoidId);
  const list = pool.length ? pool : inMode;
  const weights = list.map((p) => {
    const st = store.stats[p.id];
    let w = 1;
    if (!st) w += 2;
    else if (!st.lastCorrect) w += 3;
    else w *= 0.4;
    for (const c of new Set(cardsOf(p))) w += Math.min(3, store.weak[c] || 0);
    return w;
  });
  let r = Math.random() * weights.reduce((a, b) => a + b, 0);
  for (let i = 0; i < list.length; i++) {
    r -= weights[i];
    if (r <= 0) return list[i];
  }
  return list[list.length - 1];
}

function show(screen) {
  view.screen = screen;
  render();
  window.scrollTo(0, 0);
}

function startProblem(p) {
  if (isNight()) { checkNight(); return; }
  startDaily(p);
  if (p.exam) {
    game = { exam: { P: p, ans: {}, hints: new Set(), graded: false } };
    show('exam');
  } else if (p.mode === 'big' || p.mode === 'polymer' || p.mode === 'gen') {
    game = { big: { P: p, idx: 0, scores: [], allCorrect: true } };
    goStage();
  } else if (p.mode === 'count') {
    game = { count: { P: p, nStruct: 0, nStereo: 0, done: null } };
    show('count');
  } else {
    startNarrow(p);
  }
}

function startNarrow(p, big) {
  game = { p, struck: new Set(), opened: [], done: false, big };
  show('play');
}

// ---------- 大問の進行 ----------
function goStage() {
  const b = game.big;
  const st = b.P.stages[b.idx];
  if (!st) { show('bigdone'); return; }
  if (st.type === 'split') { game = { big: b, split: { answer: null } }; show('split'); }
  else if (st.type === 'given') { game = { big: b }; show('given'); }
  else if (st.type === 'calc') { game = { big: b, calc: { answer: null } }; show('calc'); }
  else startNarrow(st, b);
}
function nextStage(score, correct) {
  const b = game.big;
  if (score !== null) b.scores.push(score);
  if (!correct) b.allCorrect = false;
  b.idx++;
  goStage();
}

function bigProgress() {
  if (!game || !game.big) return '';
  const b = game.big;
  const label = (s) => (s.type === 'split' ? '分解' : s.type === 'calc' ? CALC_SHORT[s.key] || '計算' : s.label === 'X' ? '組み立て' : s.label);
  return `<div class="progress" aria-label="大問の進み具合">
    <span class="muted mono" style="font-size:.8rem">${esc(b.P.id)}</span>
    ${b.P.stages.map((s, i) => `<span class="step ${i < b.idx ? 'done' : i === b.idx ? 'now' : ''}">${esc(label(s))}</span>`).join('<span class="arrow">→</span>')}
  </div>`;
}

// これまでに決まった断片（大問の途中で見返す用）
function solvedSoFar() {
  if (!game || !game.big) return '';
  const b = game.big;
  const done = b.P.stages.slice(0, b.idx).filter((s) => s.type === 'narrow' || s.type === 'given');
  if (!done.length) return '';
  const smiles = (s) => (s.type === 'given' ? s.smiles : s.candidates[s.answer]);
  return `<details class="solved"><summary>決まった構造（${done.map((s) => s.label).join('・')}）</summary>
    <div class="solved-grid">${done.map((s) => `<div class="molcard"><div class="mol">${molSvg(smiles(s))}</div>
      <div class="cap"><b>${esc(s.label)}</b>${esc(molName(smiles(s)))}</div></div>`).join('')}</div></details>`;
}

// ---------- 画面: ホーム ----------
function renderHome() {
  const acc = accuracy();
  const inMode = DATA.problems.filter((p) => p.mode === view.mode);
  const solved = DATA.problems.filter((p) => store.stats[p.id] && store.stats[p.id].everCorrect).length;
  const weak = Object.entries(store.weak).filter(([c, n]) => n > 0 && DATA.cards[c]).sort((a, b) => b[1] - a[1]).slice(0, 6);
  const list = inMode.filter((p) => !view.level || gradeOfP(p) === view.level);
  // 今日の一問: 全員が同じ問題を解くタイムアタック
  const todayP = dailyProblem();
  $('#app').innerHTML = `
    <div class="stack">
      <header class="cover">
        <div class="seal">構造<br>決定</div>
        <span class="kicker">化学 ・ 有機 ・ 大問演習</span>
        <h1>有機<em>構造</em>決定</h1>
        <p>問題文と実験をすべて読み、化合物どうしの関係から構造を決める。答えは紙に書いてから選ぶ。採点は赤ペンで。</p>
      </header>
      ${todayP ? `<button class="today g${gradeOfP(todayP)}" id="go-today" style="font:inherit;text-align:left;cursor:pointer;color:inherit">
        <span><span class="s">今日の一問 ・ タイムアタック</span><br><span class="t">${esc(todayP.title || '')}</span><br>${gradeBadge(todayP)}
          <br><span class="s" id="daily-line">${dailyLineHtml()}</span></span>
        <span class="btn primary" aria-hidden="true">解く</span></button>` : ''}
      <section class="stats" aria-label="成績">
        <div class="stat"><b>${acc === null ? '—' : acc + '%'}</b><span>直近20問の正答率</span></div>
        <div class="stat"><b>${solved}<small class="muted">/${DATA.problems.length}</small></b><span>正解した問題</span></div>
        <div class="stat"><b>${store.history.length}</b><span>挑戦回数</span></div>
      </section>
      <section class="panel">
        <h2>友達と</h2>
        <div class="row">
          <button class="btn" id="go-rank">ランキング</button>
          <button class="btn" id="go-posts">みんなの意見</button>
          <button class="btn" id="go-race">早解き対戦</button>
          <button class="btn" id="go-daily">タイムアタックの順位</button>
          <button class="btn" id="go-miss">みんなの間違い</button>
        </div>
        <div id="name-box">${online.ready ? nameFormHtml() : ''}</div>
        <div id="online-status">${onlineStatusHtml()}</div>
      </section>
      <section class="panel">
        <h2>知識確認</h2>
        <p class="hint">一問一答と計算（けん化価・ヨウ素価・等電点・アセタール化・ペプチドの分子量・元素分析など）で、高校有機の基本を確かめる。範囲は教科書の ${DATA.knowledge.sections.length} 章 ${DATA.knowledge.sections.reduce((a, x) => a + x.topics.length, 0)} 節すべて。京大は教科書にない反応を問題文で与えるが、使いこなすには基本知識が正確でないといけない。</p>
        <p class="hint">覚えた問題 ${knowMastered()} / ${DATA.knowledge.items.length}（2回続けて正解したもの）</p>
        <div class="row"><button class="btn primary" id="know-weak">苦手と未挑戦から ${KNOW_LEN} 問</button><button class="btn" id="know-calc">計算問題から ${KNOW_LEN} 問</button><button class="btn" id="go-know">範囲を選ぶ</button></div>

    game.opened.push(ci);

  };

function remaining() {
  return game.p.candidates.map((_, i) => i).filter((i) => !game.struck.has(i));
}
function liveScore() {
  const extra = Math.max(0, game.opened.length - (game.p.minCards || 0));
  return Math.max(0, 100 - PER_CARD * extra);
}

function toggleStrike(i) {
  if (game.struck.has(i)) game.struck.delete(i);
  else game.struck.add(i);
  render();
}

function bindCandidates() {
  const box = $('#cands');
  box.addEventListener('click', (e) => {
    const b = e.target.closest('[data-x]');
    if (b) toggleStrike(+b.dataset.x);
  });
  box.querySelectorAll('.cand').forEach((el) => {
    let x0 = null, y0 = 0, dx = 0, horiz = false;
    el.addEventListener('pointerdown', (e) => {
      if (e.target.closest('[data-x]')) return;
      x0 = e.clientX; y0 = e.clientY; dx = 0; horiz = false;
    });
    el.addEventListener('pointermove', (e) => {
      if (x0 === null) return;
      dx = e.clientX - x0;
      const dy = e.clientY - y0;
      if (!horiz && Math.abs(dx) > 12 && Math.abs(dx) > Math.abs(dy)) {
        horiz = true;
        el.classList.add('dragging');
        try { el.setPointerCapture(e.pointerId); } catch (err) {}
      }
      if (horiz) el.style.transform = `translateX(${dx}px) rotate(${dx / 30}deg)`;
    });
    const end = () => {
      if (x0 === null) return;
      x0 = null;
      el.classList.remove('dragging');
      el.style.transform = '';
      if (horiz && Math.abs(dx) > 70) toggleStrike(+el.dataset.i);
    };
    el.addEventListener('pointerup', end);
    el.addEventListener('pointercancel', end);
  });
}

// ---------- 判定（絞り込み） ----------
function finish(chosen) {
  const p = game.p;
  const correct = chosen === p.answer;
  // 手がかりのうち、その候補を除外できるもの
  const excludedBy = (k, clueIdx) => clueIdx.filter((ci) => !same(p.clues[ci].byCandidate[k], p.clues[ci].result));
  const all = p.clues.map((_, ci) => ci);
  const guesses = [...game.struck].filter((k) => k !== p.answer && excludedBy(k, game.opened).length === 0);
  const contradictions = correct ? [] : excludedBy(chosen, all);
  const score = correct ? Math.max(0, liveScore() - PER_GUESS * guesses.length) : 0;

  // 復習リスト
  contradictions.forEach((ci) => bump(p.clues[ci].card, 1));
  guesses.forEach((k) => excludedBy(k, all).forEach((ci) => bump(p.clues[ci].card, 1)));
  if (correct && !guesses.length) game.opened.forEach((ci) => bump(p.clues[ci].card, -1));
  if (game.big) saveStore();
  else record(p.id, correct && !guesses.length, score);

  game.done = { chosen, correct, guesses, contradictions, score, excludedBy };
  show('result');
}

function molCardHtml(smiles, cap) {
  return `<div class="molcard"><div class="mol">${molSvg(smiles)}</div>
    <div class="cap"><b>${cap}</b>${esc(molName(smiles))}</div></div>`;
}

function renderResult() {
  const p = game.p;
  const r = game.done;
  const all = p.clues.map((_, ci) => ci);
  const notes = [];
  if (!r.correct) {
    r.contradictions.forEach((ci) => {
      const c = p.clues[ci];
      notes.push(`<li><b>${esc(DATA.cards[c.card].name)}</b>${game.opened.includes(ci) ? '' : '（未開封）'}:
        ${letter(r.chosen)} なら「${esc(resultText(c.card, c.byCandidate[r.chosen]))}」になるはず。実際は「${esc(resultText(c.card, c.result))}」。</li>`);
    });
  }
  if (game.struck.has(p.answer)) notes.push(`<li>正解の ${letter(p.answer)} を一度消している。</li>`);
  r.guesses.forEach((k) => {
    const cards = r.excludedBy(k, all).map((ci) => DATA.cards[p.clues[ci].card].name);
    notes.push(`<li class="warn">${letter(k)}（${esc(molName(p.candidates[k]))}）は開いたカードでは消せない。根拠なしで消した（−${PER_GUESS}）。消すなら <b>${esc(cards.join('・'))}</b> を開く。</li>`);
  });
  if (r.correct && !r.guesses.length) {
    const extra = game.opened.length - p.minCards;
    notes.push(extra <= 0
      ? `<li class="good">全部の消去に根拠があり、最少の ${p.minCards} 枚で決めた。</li>`
      : `<li class="good">全部の消去に根拠がある。開いたのは ${game.opened.length} 枚で、最少 ${p.minCards} 枚より ${extra} 枚多い（−${PER_CARD * extra}）。</li>`);
  }

  const inBig = !!game.big;
  const last = inBig && game.big.idx === game.big.P.stages.length - 1;
  $('#app').innerHTML = `
    <div class="stack">
      ${bigProgress()}
      <div class="verdict ${r.correct ? 'ok' : 'ng'}">
        <span class="eyebrow" style="color:inherit">${esc(p.id)} ・ <span class="formula">${fmtFormula(p.formula)}</span></span>
        <h2>${r.correct ? '正解' : '不正解'}</h2>
        <span class="score">${r.score} 点</span>
      </div>
      <div class="pair">
        ${molCardHtml(p.candidates[r.chosen], 'あなたの答え ' + letter(r.chosen))}
        ${r.correct ? '' : molCardHtml(p.candidates[p.answer], '正解 ' + letter(p.answer))}
      </div>
      ${inBig && !r.correct ? '<p class="hint">大問では正解の構造を使って次の段階へ進む。</p>' : ''}
      ${notes.length ? `<ul class="notes">${notes.join('')}</ul>` : ''}
      <section class="panel">
        <h2>答え合わせ表</h2>
        <p class="hint">各候補にカードを当てたときの結果。赤は実際の結果と矛盾するところ。</p>
        <div class="tbl-wrap"><table class="key">
          <thead><tr><th>候補</th>${p.clues.map((c) => `<th>${esc(DATA.cards[c.card].name)}</th>`).join('')}</tr></thead>
          <tbody>
            <tr><td class="hid">実際の結果</td>${p.clues.map((c) => `<td><b>${esc(resultText(c.card, c.result))}</b></td>`).join('')}</tr>
            ${p.candidates.map((s, k) => `<tr class="${k === p.answer ? 'ans' : ''}">
              <td>${letter(k)} ${esc(molName(s))}</td>
              ${p.clues.map((c) => `<td class="${same(c.byCandidate[k], c.result) ? '' : 'bad'}">${esc(resultText(c.card, c.byCandidate[k]))}</td>`).join('')}
            </tr>`).join('')}
          </tbody>
        </table></div>
      </section>
      <div class="row">
        ${inBig
          ? `<button class="btn primary" id="next">${last ? '大問の結果へ' : '次の段階へ'}</button>`
          : `<button class="btn primary" id="next">次の問題（おまかせ）</button>
             <button class="btn" id="retry">もう一度</button>`}
        <button class="btn ghost" id="home">問題一覧</button>
      </div>
    </div>`;
  $('#next').onclick = () => (inBig ? nextStage(r.score, r.correct) : startProblem(pickProblem(view.level, p.id)));
  if (!inBig) $('#retry').onclick = () => startProblem(p);
  $('#home').onclick = () => show('home');
}

// 京大レベルの説明（何年度の何題を物差しにしたか・いつの種か）
function genNote() {
  const gen = DATA.problems.filter((p) => p.mode === 'gen');
  const k = gen.filter((p) => p.kyoto).length;
  const g = gen.find((p) => !p.kyoto);
  const band = g ? g.band : null;
  const seed = g && g.seed ? `${g.seed.slice(0, 4)}-${g.seed.slice(4, 6)}-${g.seed.slice(6, 8)}` : '';
  void band;
  return `。京大の答え ${k} 題を同じ手順で問題化したもの（「京大○年度型の再現」）と、自動生成 ${gen.length - k} 題。${seed ? `自動生成は ${seed} の朝5時に入れ替わった。` : ''}`;
}

// ---------- 知識確認（一問一答） ----------
// 範囲は data/curriculum.json の章・節。問題は problems/knowledge.json。4択で、選択肢は毎回並べ替える
const KNOW_LEN = 10;
const PRACTICE_NAMES = { sugar: '糖の構造決定', narrow: '絞り込み型', big: '京大形式（基本）', gen: '京大形式（本番レベル）', count: '数え上げ型', polymer: '高分子型', survey: '異性体俯瞰型' };
const quiz = { items: [], idx: 0, order: [], picked: null, results: [], topics: null, calcOnly: false };
let knowSel = [];
const kst = (id) => store.know[id] || { t: 0, c: 0, streak: 0 };
const knowMastered = () => DATA.knowledge.items.filter((k) => kst(k.id).streak >= 2).length;
const topicName = (id) => { for (const sec of DATA.knowledge.sections) for (const t of sec.topics) if (t.id === id) return t.name; return id; };

// 前回まちがえた問題 > 未挑戦 > 正解したが覚えきっていない > 覚えた、の順に出やすくする
function startKnow(topics, calcOnly = false) {
  if (isNight()) { checkNight(); return; }
  const pool = DATA.knowledge.items.filter((k) => (!topics || topics.includes(k.topic)) && (!calcOnly || k.calc));
  const w = (k) => { const st = kst(k.id); return !st.t ? 3 : st.last === false ? 6 : st.streak >= 2 ? 0.3 : 1.5; };
  const bag = pool.map((k) => ({ k, key: Math.random() ** (1 / w(k)) })).sort((a, b) => b.key - a.key).slice(0, KNOW_LEN).map((x) => x.k);
  Object.assign(quiz, { items: bag, idx: 0, picked: null, results: [], topics, calcOnly });
  quiz.order = bag.map((k) => [k.a, ...k.wrong].map((c) => ({ c, r: Math.random() })).sort((a, b) => a.r - b.r).map((x) => x.c));
  show('quiz');
}

function renderKnowPick() {
  const secs = DATA.knowledge.sections;
  const prog = (tid) => { const ks = DATA.knowledge.items.filter((k) => k.topic === tid); return `${ks.filter((k) => kst(k.id).streak >= 2).length}/${ks.length}`; };
  $('#app').innerHTML = `
    <div class="stack">
      <div class="row"><button class="btn ghost" id="back">← 戻る</button></div>
      <h1>知識確認</h1>
      <p class="hint">節を選んで ${KNOW_LEN} 問。数字は覚えた問題の数（2回続けて正解）。右の小さな文字は、その内容を構造決定などの問題で練習できるモード。書いていない節は、ここでしか練習できない。</p>
      ${secs.map((sec) => `<section class="panel"><h2>${esc(sec.name)}</h2><div class="klist">
        ${sec.topics.map((t) => `<button class="kt" data-topic="${t.id}" aria-pressed="${knowSel.includes(t.id)}">
          <span>${esc(t.name)}</span><span class="mono">${prog(t.id)}</span>
          <small>${t.practice.length ? t.practice.map((m) => esc(PRACTICE_NAMES[m] || m)).join('・') : 'ここだけ'}</small></button>`).join('')}
      </div></section>`).join('')}
      <div class="row"><button class="btn primary" id="know-go">${knowSel.length ? `選んだ ${knowSel.length} 節から` : '全範囲から'} ${KNOW_LEN} 問</button>
        ${knowSel.length ? '<button class="btn ghost" id="know-clear">選択を消す</button>' : ''}</div>
    </div>`;
  $('#back').onclick = () => show('home');
  const app = $('#app');
  app.onclick = (e) => {
    const b = e.target.closest('[data-topic]');
    if (b) {
      const id = b.dataset.topic;
      knowSel = knowSel.includes(id) ? knowSel.filter((x) => x !== id) : [...knowSel, id];
      const y = window.scrollY; renderKnowPick(); window.scrollTo(0, y);
      return;
    }
    if (e.target.id === 'know-go') startKnow(knowSel.length ? knowSel : null);
    if (e.target.id === 'know-clear') { knowSel = []; renderKnowPick(); }
  };
}

function renderQuiz() {
  const done = quiz.idx >= quiz.items.length;
  if (done) {
    const ok = quiz.results.filter((r) => r.ok).length;
    const wrong = quiz.results.filter((r) => !r.ok);
    $('#app').innerHTML = `

        <h1>知識確認の結果</h1>

        ${wrong.length ? `<section class="panel"><h2>まちがえた問題</h2><ul class="kwrong">${wrong.map(({ k }) => `<li><b>${esc(k.q)}</b><br>正解: ${esc(k.a)}<br><span class="muted">${esc(k.explain)}</span><br><small class="muted">${esc(topicName(k.topic))}</small></li>`).join('')}</ul>
          <p class="hint">教科書のその節を読み直してから、もう一度解く。まちがえた問題は次から出やすくなる。</p></section>` : '<p class="hint">全問正解。</p>'}
        <div class="row"><button class="btn primary" id="again">もう ${KNOW_LEN} 問</button><button class="btn" id="pick">範囲を選ぶ</button></div>
      </div>`;
    $('#back').onclick = () => show('home');
    $('#again').onclick = () => startKnow(quiz.topics, quiz.calcOnly);
    $('#pick').onclick = () => show('know');
    return;
  }
  const k = quiz.items[quiz.idx];
  const opts = quiz.order[quiz.idx];
  const picked = quiz.picked;
  $('#app').innerHTML = `
    <div class="stack">
      <div class="row" style="justify-content:space-between"><button class="btn ghost" id="back">← やめる</button><span class="mono">${quiz.idx + 1} / ${quiz.items.length}</span></div>
      <p class="eyebrow">${esc(topicName(k.topic))}${k.calc ? ' ・ 計算（紙に式を書いてから選ぶ）' : ''}</p>
      <h2 class="kq">${esc(k.q)}</h2>
      <div class="kopts">${opts.map((c, i) => {
        const cls = picked === null ? '' : c === k.a ? 'right' : i === picked ? 'wrong' : '';
        return `<button class="kopt ${cls}" data-i="${i}" ${picked !== null ? 'disabled' : ''}>${esc(c)}</button>`;
      }).join('')}</div>
      ${picked !== null ? `<div class="expl"><p><b>${opts[picked] === k.a ? '〇 正解' : '× 不正解'}</b></p><p>${esc(k.explain)}</p></div>
        <div class="row"><button class="btn primary" id="knext">${quiz.idx + 1 < quiz.items.length ? '次へ' : '結果を見る'}</button></div>` : '<p class="hint">答えを頭の中で言ってから選ぶ。</p>'}
    </div>`;
  $('#back').onclick = () => show('home');
  const app = $('#app');
  app.onclick = (e) => {
    const b = e.target.closest('[data-i]');
    if (b && quiz.picked === null) {
      quiz.picked = Number(b.dataset.i);
      const ok = opts[quiz.picked] === k.a;
      const st = kst(k.id);
      store.know[k.id] = { t: st.t + 1, c: st.c + (ok ? 1 : 0), streak: ok ? (st.streak || 0) + 1 : 0, last: ok, at: Date.now() };
      saveStore();
      quiz.results.push({ k, ok });
      renderQuiz();
      return;
    }
    if (e.target.id === 'knext') { quiz.idx++; quiz.picked = null; renderQuiz(); window.scrollTo(0, 0); }
  };
}

const custom = { index: null, err: null, loading: false, tpl: '', frags: [], grades: [], calcs: [], noCalc: false, rel: '', rules: '', msg: '' };
try { Object.assign(custom, JSON.parse(localStorage.getItem('jouzoukettei.custom') || '{}'), { index: null, err: null, loading: false, msg: '' }); } catch (e) {}

async function loadPoolIndex() {
  if (custom.index || custom.loading) return;
  custom.loading = true;
  try {
    const res = await fetch('pool/index.json', { cache: 'no-cache' });
    if (!res.ok) throw new Error(res.status);
    custom.index = await res.json();
  } catch (e) {
    custom.err = '問題の在庫を読めなかった。この機能は公開版（GitHub Pages）で開いたときに使える。';
  }
  custom.loading = false;
  if (view.screen === 'custom') renderCustom();
}

function customMatches() {
  if (!custom.index) return [];
  return custom.index.items.filter((it) =>
    (!custom.tpl || it.template === custom.tpl)
    && (!custom.frags.length || custom.frags.some((f) => it.frags.includes(f)))
    && (!custom.grades.length || custom.grades.includes(it.grade))
    && (custom.noCalc ? !it.calcs.length : custom.calcs.every((c) => it.calcs.includes(c)))
    && (!custom.rel || (custom.rel === 'y') === (it.relations || it.derived))
    && (!custom.rules || (custom.rules === 'y') === it.rules));
}

async function customGo(avoidId) {
  const ms = customMatches();
  if (!ms.length) { custom.msg = '条件に合う問題がない。条件を減らす。'; show('custom'); return; }
  // まだ正解していない問題を優先し、その中からランダム
  const fresh = ms.filter((it) => it.id !== avoidId && !(store.stats[it.id] && store.stats[it.id].everCorrect));
  const list = fresh.length ? fresh : ms.filter((it) => it.id !== avoidId).length ? ms.filter((it) => it.id !== avoidId) : ms;
  const it = list[Math.floor(Math.random() * list.length)];
  try {
    if (!poolLoaded[it.id]) {
      const res = await fetch(`pool/${encodeURIComponent(it.id)}.json`);
      if (!res.ok) throw new Error(res.status);
      const d = await res.json();
      Object.assign(DATA.molecules, d.molecules);
      poolLoaded[it.id] = { ...d.problem, pool: true };
    }
    startProblem(poolLoaded[it.id]);
  } catch (e) {
    custom.msg = '問題を読めなかった。通信を確かめてもう一度。';
    show('custom');
  }
}

        ${chip('rel', '', '問わない', !custom.rel)}${chip('rel', 'y', '含む（京大型）', custom.rel === 'y')}${chip('rel', 'n', '含まない', custom.rel === 'n')}
      </div>
      <h2>与えられた規則（教科書にない反応）</h2><div class="row">
        ${chip('rules', '', '問わない', !custom.rules)}${chip('rules', 'y', '含む', custom.rules === 'y')}${chip('rules', 'n', '含まない', custom.rules === 'n')}
      </div></section>
      <div class="row"><button class="btn primary" id="custom-go" ${n ? '' : 'disabled'}>この条件で1問（${n} 問から）</button>
        <button class="btn ghost" id="custom-reset">条件を消す</button></div>
      <p class="hint">${esc(custom.msg)}</p>`}
    </div>`;
  custom.msg = '';
  $('#back').onclick = () => show('home');
  if (!idx) return;
  const app = $('#app');
  app.onclick = (e) => {
    const b = e.target.closest('[data-g]');
    if (b) {
      const g = b.dataset.g, v = b.dataset.v;
      const toggle = (arr, x) => (arr.includes(x) ? arr.filter((y) => y !== x) : [...arr, x]);
      if (g === 'tpl') custom.tpl = v;
      else if (g === 'frag') custom.frags = toggle(custom.frags, v);
      else if (g === 'grade') custom.grades = toggle(custom.grades, Number(v));
      else if (g === 'calc') { custom.calcs = toggle(custom.calcs, v); custom.noCalc = false; }
      else if (g === 'nocalc') { custom.noCalc = !custom.noCalc; if (custom.noCalc) custom.calcs = []; }
      else if (g === 'rel') custom.rel = v;
      else if (g === 'rules') custom.rules = v;
      saveCustom();
      const y = window.scrollY; renderCustom(); window.scrollTo(0, y);
      return;
    }
    if (e.target.id === 'custom-go') { app.onclick = null; customGo(); }
    if (e.target.id === 'custom-reset') { Object.assign(custom, { tpl: '', frags: [], grades: [], calcs: [], noCalc: false, rel: '', rules: '' }); saveCustom(); renderCustom(); }
  };
}

// ---------- オンライン（claude.ai で開いたときだけ動く） ----------
// A: ランキング   db の scores/<自分のid> に解いた問題の一覧を書き、全員分を読んで並べる
// B: 意見投稿欄   db の posts/<自分のid> に自分の投稿（最新50件）を持つ
// C: 早解き対戦   room の名前付き部屋で同じ問題を同時に解き、進み具合を presence で共有する
const RACE_LEN = 5;
const RACE_PENALTY = 10000;
const POST_MAX = 300;
const online = { ready: false, off: false, provider: null, user: null, db: null, room: null, uid: null, scores: [], posts: [], mistakes: [], daily: [], writeErr: null };
let writeChain = Promise.resolve();

async function initOnline() {
  let user, db, room;
  if (window.claude && typeof window.claude.use === 'function') {
    online.provider = 'claude';
    [user, db, room] = await Promise.all([
      window.claude.use('user'), window.claude.use('db'), window.claude.use('room'),
    ]);
  } else if (ONLINE_CONFIG && ONLINE_CONFIG.firebase) {
    // GitHub Pages など claude.ai の外: 同じ形の窓口を Firebase で用意する
    online.provider = 'firebase';
    ({ user, db, room } = await firebaseBackend(ONLINE_CONFIG.firebase));
  } else {
    online.ready = true;
    online.off = true;
    return;
  }
  Object.assign(online, { user, db, room });
  online.uid = user ? await user.id() : null;
  online.ready = true;
  if (db) {
    db.collection('scores').orderBy('solved', 'desc').limit(200).onSnapshot((s) => {
      online.scores = s.docs.map((d) => ({ id: d.id, ...d.data() }));
      refreshOnline();
    }, () => { online.scores = []; });
    db.collection('posts').onSnapshot((s) => {
      online.posts = s.docs.map((d) => ({ id: d.id, ...d.data() }));
      refreshOnline();
    }, () => { online.posts = []; });
    db.collection('mistakes').limit(300).onSnapshot((s) => {
      online.mistakes = s.docs.map((d) => ({ id: d.id, ...d.data() }));
      refreshOnline();
    }, () => { online.mistakes = []; });
    db.collection('daily').orderBy('at', 'desc').limit(300).onSnapshot((s) => {
      online.daily = s.docs.map((d) => ({ id: d.id, ...d.data() }));
      refreshOnline();
    }, () => { online.daily = []; });
    if (online.uid) { mergeRemoteScore(); syncMistakes(); submitDaily(); }
  }
  refreshOnline();
}

// 画面全体ではなく一覧だけ描き直す（入力中の文字を消さないため）

// data-uid を持つ要素に名前を入れる。名前は保存せず、表示のたびに引く
async function fillNames(root) {

  els.forEach((e) => {

function mySolvedIds() {
  return Object.keys(store.stats).filter((id) => store.stats[id].everCorrect && inMain(id));
}

// 自分の成績を scores/<id> に書く。同じ文書への書き込みは1つずつ
function syncScore() {
  if (!online.db || !online.uid) return;
  const ids = mySolvedIds();
  const body = {
    solved: ids.length,
    ids,
    points: ids.reduce((a, id) => a + (store.stats[id].best || 0), 0),
    wins: store.wins || 0,
    updatedAt: Date.now(),
  };
  writeChain = writeChain
    .then(() => online.db.doc('scores/' + online.uid).set(body))
    .then(() => { online.writeErr = null; })
    .catch((e) => { online.writeErr = e && e.code; refreshOnline(); });
}

// 別の端末で解いた分を取り込む（和集合）
async function mergeRemoteScore() {
  try {
    const snap = await online.db.doc('scores/' + online.uid).get();
    let changed = false;
    if (snap.exists) {
      const d = snap.data();
      (Array.isArray(d.ids) ? d.ids : []).forEach((id) => {
        if (typeof id !== 'string' || !byId(id)) return;
        const st = store.stats[id];
        if (!st || !st.everCorrect) {
          store.stats[id] = { tries: st ? st.tries : 0, correct: st ? st.correct : 0, best: st ? st.best : 0, ...st, everCorrect: true };
        }
      });
      if (typeof d.wins === 'number' && d.wins > (store.wins || 0)) store.wins = d.wins;
      saveStore();
      changed = !snap.exists || mySolvedIds().length !== d.solved || (store.wins || 0) !== d.wins;
    } else {
      changed = mySolvedIds().length > 0;
    }
    if (changed) syncScore();
  } catch (e) {}
}

// ---- claude.ai の外で使う Firebase の窓口 ----
// window.claude.use('user' | 'db' | 'room') と同じ呼び方ができるものを、Firebase Authentication（匿名）と Cloud Firestore で作る。
//   profiles/<uid>              名前
//   scores/<uid>, posts/<uid>   claude.ai 版と同じ
//   rooms/<部屋>/peers/<peer>   対戦の参加者と進み具合（15 秒ごとに更新し、45 秒更新がなければいないとみなす）
//   rooms/<部屋>/events/<id>    対戦の開始の合図
const NAME_MAX = 20;
const FIREBASE_SDK = 'https://www.gstatic.com/firebasejs/10.12.2/';
async function firebaseBackend(cfg) {
  const [app, auth, fs] = await Promise.all([
    import(FIREBASE_SDK + 'firebase-app.js'),
    import(FIREBASE_SDK + 'firebase-auth.js'),
    import(FIREBASE_SDK + 'firebase-firestore.js'),
  ]);
  const { emulator, ...appCfg } = cfg;
  const fa = app.initializeApp(appCfg);
  const au = auth.getAuth(fa);
  const store_ = fs.getFirestore(fa);
  // 手元で試すとき: firebase.config.json に "emulator": "127.0.0.1" を足すと Firebase Emulator Suite につなぐ
  if (emulator) {
    auth.connectAuthEmulator(au, `http://${emulator}:9099`, { disableWarnings: true });
    fs.connectFirestoreEmulator(store_, emulator, 8080);
  }
  await auth.signInAnonymously(au);
  const uid = au.currentUser.uid;

  const wrapDoc = (d) => ({ id: d.id, exists: d.exists(), data: () => d.data() });
  const wrapSnap = (q) => ({ docs: q.docs.map(wrapDoc) });

  // --- user ---
  const names = new Map();
  let myName = '';
  try {
    const d = await fs.getDoc(fs.doc(store_, 'profiles', uid));
    if (d.exists() && typeof d.data().name === 'string') myName = d.data().name;
  } catch (e) {}
  names.set(uid, myName);
  const user = {
    id: async () => uid,
    myName: () => myName,
    async setName(name) {
      await fs.setDoc(fs.doc(store_, 'profiles', uid), { name, updatedAt: Date.now() });
      myName = name;
      names.set(uid, name);
      refreshOnline();
    },
    async profiles(ids) {
      await Promise.all(ids.filter((id) => !names.has(id)).map(async (id) => {
        try {
          const d = await fs.getDoc(fs.doc(store_, 'profiles', id));
          names.set(id, d.exists() && typeof d.data().name === 'string' ? d.data().name : '');
        } catch (e) { names.set(id, ''); }
      }));
      const out = {};
      ids.forEach((id) => { out[id] = { name: names.get(id) || '' }; });
      return out;
    },
  };

  // --- db（使っている呼び方だけ） ---
  const makeQuery = (name, cons) => ({
    orderBy: (f, dir) => makeQuery(name, [...cons, fs.orderBy(f, dir)]),
    limit: (n) => makeQuery(name, [...cons, fs.limit(n)]),
    onSnapshot: (ok, ng) => fs.onSnapshot(fs.query(fs.collection(store_, name), ...cons), (q) => ok(wrapSnap(q)), ng),
  });
  const db = {
    collection: (name) => makeQuery(name, []),
    doc: (p) => {
      const r = fs.doc(store_, p);
      return { get: async () => wrapDoc(await fs.getDoc(r)), set: (body) => fs.setDoc(r, body) };
    },
  };

  // --- room ---
  const room = {
    async join(name) {
      name = String(name).replace(/[^a-z0-9-]/g, '').slice(0, 40);
      const me = Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
      const peersCol = fs.collection(store_, 'rooms', name, 'peers');
      const myRef = fs.doc(peersCol, me);
      let presence = {}, raw = [], list = [], peerCbs = [], handlers = {}, unsubs = [], left = false;
      const alive = () => raw.filter((p) => p.id === me || Date.now() - (p.at || 0) < 45000);
      const recompute = () => {
        list = alive().map((p) => ({ peer: p.id, kind: 'viewer', by: p.uid, sameTab: p.id === me, presence: p.presence || {} }));
        peerCbs.forEach((cb) => cb({ peers: list }));
      };
      const beat = () => fs.setDoc(myRef, { uid, presence, at: Date.now() }).catch(() => {});
      await beat();
      await new Promise((resolve) => {
        let first = true;
        unsubs.push(fs.onSnapshot(peersCol, (q) => {
          raw = q.docs.map((d) => ({ id: d.id, ...d.data() }));
          recompute();
          if (first) { first = false; resolve(); }
        }, () => resolve()));
      });
      // 入る前の合図は捨て、入ってから届いたものだけ渡す（自分の合図も戻ってくる）
      let firstEv = true;
      unsubs.push(fs.onSnapshot(fs.query(fs.collection(store_, 'rooms', name, 'events'), fs.orderBy('at', 'desc'), fs.limit(5)), (q) => {
        if (firstEv) { firstEv = false; return; }
        q.docChanges().forEach((ch) => {
          if (ch.type !== 'added') return;
          const d = ch.doc.data();
          (handlers[d.type] || []).forEach((cb) => cb({ data: d.data, by: d.uid }));
        });
      }, () => {}));
      const timer = setInterval(() => { beat(); recompute(); }, 15000);
      const bye = () => { if (!left) fs.deleteDoc(myRef).catch(() => {}); };
      window.addEventListener('pagehide', bye);
      return {
        peers: () => list,
        onPeers: (cb) => { peerCbs.push(cb); },
        on: (type, cb) => { (handlers[type] = handlers[type] || []).push(cb); },
        presence: (p) => { presence = p || {}; beat(); },
        emit: (type, data) => fs.addDoc(fs.collection(store_, 'rooms', name, 'events'), { type, data, uid, at: Date.now() }),
        async leave() {
          left = true;
          clearInterval(timer);
          window.removeEventListener('pagehide', bye);
          unsubs.forEach((u) => u());
          await fs.deleteDoc(myRef).catch(() => {});
        },
      };
    },
  };
  return { user, db, room };
}

// ---- D: みんなの間違い ----
// mistakes/<自分のid> に、問題ごとの挑戦・正解の回数と、大問の設問ごとの間違いの回数、間違えたカードの回数を書く。
// 全員分を足して、正答率の低い問題・設問・カードを並べる
function syncMistakes() {
  if (!online.db || !online.uid) return;
  const pm = {};
  Object.keys(store.stats).filter(byId).forEach((id) => {
    const st = store.stats[id], qs = store.qstat[id];
    pm[id] = { t: st.tries || 0, c: st.correct || 0, ...(qs ? { n: qs.n, m: qs.m } : {}) };
  });
  const k = {};
  Object.entries(store.cardMiss).forEach(([c, n]) => { if (DATA.cards[c] && n > 0) k[c] = n; });
  writeChain = writeChain
    .then(() => online.db.doc('mistakes/' + online.uid).set({ p: pm, k, updatedAt: Date.now() }))
    .catch(() => {});
}

// 全員分を足す: { p: { id: { t, c, n, m: { no: 回数 } } }, k: { card: 回数 }, people }
function missTotals() {
  const p = {}, k = {};
  online.mistakes.forEach((d) => {
    Object.entries(d.p && typeof d.p === 'object' ? d.p : {}).forEach(([id, v]) => {
      if (!byId(id) || !v) return;
      const a = p[id] || (p[id] = { t: 0, c: 0, n: 0, m: {}, who: 0 });
      a.t += Number(v.t) || 0; a.c += Number(v.c) || 0; a.n += Number(v.n) || 0; a.who++;
      Object.entries(v.m && typeof v.m === 'object' ? v.m : {}).forEach(([no, x]) => { a.m[no] = (a.m[no] || 0) + (Number(x) || 0); });
    });
    Object.entries(d.k && typeof d.k === 'object' ? d.k : {}).forEach(([c, x]) => { if (DATA.cards[c]) k[c] = (k[c] || 0) + (Number(x) || 0); });
  });
  return { p, k, people: online.mistakes.length };
}

function qRateHtml(id, no) {
  if (!online.db) return '';
  const a = missTotals().p[id];
  if (!a || a.n < 2) return '';
  const r = Math.round((100 * (a.n - (a.m[no] || 0))) / a.n);
  return `<p class="qrate ${r < 50 ? 'low' : ''}">みんなの正答率 ${r}%（${a.n} 回）</p>`;
}

function missListHtml() {
  if (!online.mistakes.length) return '<p class="hint">まだ記録がない。</p>';
  const { p, k, people } = missTotals();
  const rows = Object.entries(p).filter(([, a]) => a.t >= 2)
    .map(([id, a]) => ({ P: byId(id), a, r: a.c / a.t }))
    .sort((x, y) => x.r - y.r || y.a.t - x.a.t).slice(0, 30);
  const worstQ = (P, a) => {
    if (!P.exam || a.n < 2) return '';
    const qs = P.exam.questions.filter((q) => q.type !== 'essay').map((q) => ({ q, r: (a.n - (a.m[q.no] || 0)) / a.n })).sort((x, y) => x.r - y.r);
    return qs.length && qs[0].r < 1 ? `問${qs[0].q.no}（正答率 ${Math.round(100 * qs[0].r)}%）` : '';
  };
  const cards = Object.entries(k).sort((a, b) => b[1] - a[1]).slice(0, 10);
  return `<p class="hint">${people} 人分の記録。</p>
    <h2>正答率の低い問題</h2>
    ${rows.length ? `<div class="tbl-wrap"><table class="key rank">
      <thead><tr><th>問題</th><th>正答率</th><th>挑戦</th><th>いちばん間違える設問</th><th></th></tr></thead>
      <tbody>${rows.map(({ P, a, r }) => `<tr><td>${esc(P.title || P.id)}<br>${gradeBadge(P)}</td>
        <td class="mono">${Math.round(100 * r)}%</td><td class="mono">${a.t}<span class="muted"> 回・${a.who} 人</span></td>
        <td>${esc(worstQ(P, a))}</td><td><button class="btn small" data-solve="${esc(P.id)}">解く</button></td></tr>`).join('')}</tbody></table></div>`
      : '<p class="hint">2 回以上挑戦された問題がまだない。</p>'}
    <h2>みんなが間違えた手がかりカード</h2>
    ${cards.length ? `<ul class="misscards">${cards.map(([c, n]) => `<li><b>${esc(DATA.cards[c].name)}</b><span class="mono">${n} 回</span></li>`).join('')}</ul>`
      : '<p class="hint">まだない。</p>'}`;
}

function renderMiss() {
  $('#app').innerHTML = `
    <div class="stack">
      <div class="row"><button class="btn ghost" id="back">← 戻る</button></div>
      <h1>みんなの間違い</h1>
      <p class="hint">全員の記録を足して、正答率の低い問題・設問と、見落としやすい手がかりを並べる。みんなが落とす問題を落とさなければ差がつく。</p>
      ${online.db ? '<div id="miss-list"></div>' : onlineStatusHtml()}

    el.innerHTML = missListHtml();

// ---- E: 今日のタイムアタック ----
// 毎朝5時に入れ替わる自動生成の大問から、日付で決まる1問（京大下位〜京大平均）を全員が解く。
// 最初に開いた時刻から採点までの時間を測り、その日の最初の採点だけを daily/<日付>_<自分のid> に書く。
// 並べ方は得点の高い順、同点なら時間の短い順
function dailyProblem() {
  const gens = DATA.problems.filter((p) => p.mode === 'gen' && !p.kyoto && p.exam);
  if (!gens.length) return null;
  const pool = gens.filter((p) => [3, 4].includes(gradeOfP(p))).length ? gens.filter((p) => [3, 4].includes(gradeOfP(p))) : gens;
  const seed = String(gens[0].seed || '');
  const h = [...seed].reduce((a, c) => (a * 31 + c.charCodeAt(0)) >>> 0, 17);
  return pool[h % pool.length];
}
const dailyKey = () => { const p = dailyProblem(); return p ? String(p.seed || p.id) : ''; };

function startDaily(p) {
  const key = dailyKey();
  if (!key || p !== dailyProblem()) return;
  if (!store.daily[key] && !isNight()) { store.daily = { [key]: { start: Date.now(), done: null } }; saveStore(); }
}

function finishDaily(P, pct) {
  const key = dailyKey();
  const d = store.daily[key];
  if (!d || P !== dailyProblem() || d.done) return;
  d.done = { score: pct, ms: Date.now() - d.start };
  saveStore();
  submitDaily();
}

// 書けなかったとき（オフラインなど）は、次に開いたときにもう一度書く
function submitDaily() {
  const key = dailyKey();
  const d = store.daily[key];
  if (!online.db || !online.uid || !d || !d.done || d.sent) return;
  const docId = key + '_' + online.uid;
  writeChain = writeChain
    .then(() => online.db.doc('daily/' + docId).get())

const race = { rm: null, code: '', peers: [], round: null, ids: [], idx: 0, startAt: 0, penalty: 0, wrong: new Set(), finished: null, counted: false, msg: '' };

function raceCode() {
  const cs = 'abcdefghjkmnpqrstuvwxyz23456789';
  return Array.from({ length: 4 }, () => cs[Math.floor(Math.random() * cs.length)]).join('');
}

async function joinRace(code) {
  code = String(code || '').toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 8);
  if (!code) { race.msg = '部屋コードを入れる。'; render(); return; }
  if (isNight()) { checkNight(); return; }
  try {
    if (race.rm) await race.rm.leave();
    const rm = await online.room.join('race-' + code);
    Object.assign(race, { rm, code, round: null, peers: rm.peers(), msg: '' });
    rm.onPeers((ch) => { race.peers = ch.peers; racePeersChanged(); });
    rm.on('start', (m) => onRaceStart(m.data));
    rm.presence({ uid: online.uid, round: null, idx: 0, done: null, pen: 0 });
    show('race');
  } catch (e) {
    race.msg = '部屋に入れなかった。少し待ってからもう一度。';
    render();
  }
}

async function leaveRace() {
  if (race.rm) { try { await race.rm.leave(); } catch (e) {} }
  race.rm = null;
  race.round = null;
  show('home');
}

function startRace() {
  const pool = DATA.problems.filter((p) => p.mode === 'narrow');
  const ids = [];
  while (ids.length < RACE_LEN && ids.length < pool.length) {
    const p = pool[Math.floor(Math.random() * pool.length)];
    if (!ids.includes(p.id)) ids.push(p.id);
  }
  // 自分の画面も、戻ってきた自分の発信（エコー）で始める
  race.rm.emit('start', { round: Date.now().toString(36), ids }).catch(() => {
    race.msg = '開始の合図を送れなかった。';
    render();
  });
}

function onRaceStart(data) {
  if (!data || typeof data.round !== 'string' || !Array.isArray(data.ids)) return;
  const ids = data.ids.filter((id) => typeof id === 'string' && byId(id) && byId(id).mode === 'narrow').slice(0, 10);
  if (!ids.length || isNight()) return;
  Object.assign(race, { round: data.round.slice(0, 20), ids, idx: 0, startAt: Date.now() + 3000, penalty: 0, wrong: new Set(), finished: null, counted: false });
  race.rm.presence({ uid: online.uid, round: race.round, idx: 0, done: null, pen: 0 });
  show('raceplay');
}

function raceElapsed() {
  return Math.max(0, (race.finished !== null ? race.finished : Date.now() - race.startAt + race.penalty));
}
const fmtSec = (ms) => (ms / 1000).toFixed(1) + ' 秒';

function racePlayers() {
  return race.peers.filter((p) => p.kind === 'viewer').map((p) => ({
    peer: p.peer,

}

function racePick(i) {
  const p = byId(race.ids[race.idx]);

// 部屋の全員が完走し、自分が最速なら勝利を1つ数える（1ラウンド1回）
function checkRaceWin() {
  if (race.counted || race.finished === null) return;
  const ps = racePlayers().filter((p) => p.round === race.round);
  if (ps.length < 2 || ps.some((p) => p.done === null)) return;
  race.counted = true;
  const best = Math.min(...ps.map((p) => p.done));
  if (race.finished <= best) {
    store.wins = (store.wins || 0) + 1;
    saveStore();
    syncScore();
  }
}

// ---------- 画面: 京大形式（問題文と実験を全部読んでから、問1〜に答える） ----------
const HINT_COST = 1;
// 分子式を「C8H10O」の形にそろえる（小文字・下付き・空白・順序の違いを吸収）
function normFormula(t) {
  let x = String(t || '').replace(/[₀-₉]/g, (d) => '₀₁₂₃₄₅₆₇₈₉'.indexOf(d)).replace(/[\s　]/g, '')
    .replace(/[Ａ-Ｚａ-ｚ０-９]/g, (c) => String.fromCharCode(c.charCodeAt(0) - 0xfee0));
  // 小文字だけで書かれたら（c4h8o）元素記号に直す
  if (!/[A-Z]/.test(x)) x = x.replace(/cl/g, 'Cl').replace(/br/g, 'Br').replace(/[chonsfi]/g, (c) => c.toUpperCase());
  const c = {};
  const re = /([A-Z][a-z]?)(\d*)/g;
  let m, used = 0;
  while ((m = re.exec(x))) { if (!m[0]) break; c[m[1]] = (c[m[1]] || 0) + (m[2] ? +m[2] : 1); used += m[0].length; }
  if (used !== x.length || !Object.keys(c).length) return null;
  const order = ['C', 'H', ...Object.keys(c).filter((e) => e !== 'C' && e !== 'H').sort()];
  return order.filter((e) => c[e]).map((e) => e + (c[e] > 1 ? c[e] : '')).join('');
}
function answered(q, a) {
  if (q.type === 'draw') return typeof a === 'string' && a.trim().length > 0;
  if (a === undefined || a === null || a === '' || (Array.isArray(a) && !a.length)) return false;
  if (q.type === 'assign') return q.items.every((it) => a[it]);
  if (q.type === 'essay') return String(a).trim().length > 0;
  return true;
}
// 有効数字 n けたに丸める
const roundSig = (x, n) => Number(Number(x).toPrecision(n));
// 構造式の記述: 答えの構造（順序は問わない）と同じものの数 − 余分に書いた数
function drawResult(q, a) { return window.SmilesLite.grade(q.answer, a); }
function examScore(q, a, self) {
  if (q.type === 'essay') {
    // 採点基準（必須要素）のうち、入っているものにチェックした割合
    if (q.rubric && q.rubric.length) { const got = (self && self[q.no]) || []; return Math.round((q.points * (Array.isArray(got) ? got.length : 0)) / q.rubric.length); }
    return Math.round(q.points * ((self && self[q.no]) || 0));
  }
  if (q.type === 'draw') {
    if (!answered(q, a)) return 0;
    const g = drawResult(q, a);
    return Math.max(0, Math.round((q.points * (g.hits - g.extra)) / g.n));
  }
  if (q.type === 'number' && q.sig) {
    // 有効数字どおりなら満点、最後のけたが 1 ずれていれば半分
    const v = Number(String(a).replace(/[，,]/g, '.'));
    if (!Number.isFinite(v)) return 0;
    if (roundSig(v, q.sig) === q.answer) return q.points;
    const step = Math.pow(10, Math.floor(Math.log10(Math.abs(q.answer))) - q.sig + 1);
    return Math.abs(roundSig(v, q.sig) - q.answer) <= step * 1.0001 ? Math.round(q.points / 2) : 0;
  }
  if (!answered(q, a) && q.type !== 'assign') return 0;
  if (q.type === 'assign') {
    if (!a) return 0;
    const ok = q.items.filter((it, i) => a[it] === q.answer[i]).length;
    return Math.round((q.points * ok) / q.items.length);
  }
  if (q.type === 'formula') return normFormula(a) === normFormula(q.answer) ? q.points : 0;
  if (q.type === 'number') {
    const v = Number(String(a).replace(/[，,]/g, '.'));
    if (q.tol) return Math.abs(v - q.answer) <= Math.abs(q.answer) * q.tol + 1e-9 ? q.points : 0;
    return v === Number(q.answer) ? q.points : 0;
  }
  if (q.type === 'multi') {
    const hit = a.filter((x) => q.answer.includes(x)).length;
    const miss = a.length - hit;
    return Math.max(0, Math.round((q.points * (hit - miss)) / q.answer.length));
  }
  return a.length === 1 && a[0] === q.answer[0] ? q.points : 0;
}
const GROUP = (g) => (g === 'X' ? '化合物 X について' : g === 'rel' ? '化合物どうしの関係' : `化合物 ${g} について`);
// 選択肢の名前は採点後にだけ出す（名前で選べないようにする）
function molOpt(s, sel, cls = '', named = false) {
  return `<button class="opt ${sel ? 'sel' : ''} ${cls}" data-v="${esc(s)}" aria-pressed="${sel}"><span class="mol">${molSvg(s)}</span><span class="pn">${named ? esc(molName(s)) : ''}</span></button>`;
}

const SMILES_PAL = ['C', 'O', 'N', '=', '(', ')', '1', '2', 'c1ccccc1', '.', '⏎', '⌫'];
function drawInputHtml(q, a, graded) {
  return `<div class="draw">

    ${graded ? '' : `<div class="pal" data-pal="${q.no}">${SMILES_PAL.map((t) => `<button type="button" data-ins="${esc(t)}">${esc(t)}</button>`).join('')}</div>`}
    <div class="prev" id="prev-${q.no}" aria-live="polite">${previewHtml(a || '')}</div>
    ${graded ? '' : `<details class="smiles-help"><summary>SMILES の書き方</summary>
      水素は書かない。原子を左から順に並べる: <code>CCO</code> エタノール、<code>CC(C)O</code> 2-プロパノール（枝は括弧）。
      二重結合は <code>=</code>: <code>CC=O</code> アセトアルデヒド。環は同じ数字で閉じる: <code>C1CCCCO1</code>（六員環のエーテル）、ベンゼン環は <code>c1ccccc1</code>。
      <code>COC(C)OC</code> は CH₃–O–CH(CH₃)–O–CH₃。複数の化合物は改行か「.」で区切る。立体（くさび）は書かなくてよい。</details>`}
  </div>`;
}
function previewHtml(text) {
  const parts = String(text || '').split(/[\n、,，;；]+/).flatMap((x) => x.split('.')).map((x) => x.trim()).filter(Boolean);
  if (!parts.length) return '<span class="muted">ここに構造式が出る</span>';
  return parts.map((p) => {
    try { const g = window.SmilesLite.parse(p); return `<span>${window.SmilesLite.toSvg(g)}<span class="pf">${fmtFormula(window.SmilesLite.formula(g))}</span></span>`; }
    catch (e) { return `<span class="err">${esc(p)}: ${esc(e.message)}</span>`; }
  }).join('');
}
function schemeHtml(sc, note) {
  if (!sc) return '';
  return `<div class="scheme">${sc.map((x) => (['+', '⇄', '→'].includes(x) ? `<span class="op">${x}</span>` : `<span class="mol">${molSvg(x)}</span>`)).join('')}${note ? `<span class="note">（${esc(note)}）</span>` : ''}</div>`;
}
function k26RulePane(X) {

    <h3>${esc(pt.label)} の規則</h3>
    ${pt.equation ? `<div class="eqn">${[...pt.equation.lhs.map((t, i) => [i ? '+' : '', t]), ['→', ''], ...pt.equation.rhs.map((t, i) => [i ? '+' : '', t])].map(([op, t]) => `${op ? `<span class="op">${op}</span>` : ''}${t ? `<span class="sp"><span>${esc(t)}</span><small>${pt.equation.masses[t] !== undefined ? `分子量 ${pt.equation.masses[t]}` : ''}</small></span>` : ''}`).join('')}<span class="muted" style="font-size:.78rem">（式1）</span></div>` : ''}
    ${pt.rules.map((ru) => `<div class="rule"><span class="rid">${esc(ru.id)}</span><b>${esc(ru.title || '')}</b><br>${esc(ru.text)}${schemeHtml(ru.scheme, ru.schemeNote)}</div>`).join('')}
    ${pt.limitation ? `<p class="limit">${esc(pt.limitation)}</p>` : ''}`).join('')}</aside>`;
}
function k26PartHtml(pt, X, E) {
