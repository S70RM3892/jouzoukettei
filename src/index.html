    ${pt.tail ? `<p class="story">${esc(pt.tail)}</p>` : ''}
    ${pt.expLead ? `<p class="story">${esc(pt.expLead)}</p>` : ''}
    ${exps.length ? `<ol class="exps">${exps.map(({ e, i }) => `<li><span class="lab">${esc(e.label)}</span><span class="tx">${esc(e.text)}</span>
      ${e.hint ? `<button class="hintbtn" data-h="${i}" aria-expanded="${E.hints.has(i)}">${E.hints.has(i) ? 'わかること' : `わかること（−${HINT_COST}点）`}</button>${E.hints.has(i) ? `<p class="hinttx">${esc(e.hint)}</p>` : ''}` : ''}</li>`).join('')}</ol>` : ''}
    ${pt.tailY ? `<p class="story">${esc(pt.tailY)}</p>` : ''}
    <p class="hint">原子量: H = 1.0, C = 12, O = 16。</p>
  </section>`;
}
function k26SheetHtml() { return ''; }

function renderExam() {
  const E = game.exam;
  const P = E.P;
  const X = P.exam;
  const graded = E.graded;
  E.self = E.self || {};
  const scores = graded ? X.questions.map((q) => examScore(q, E.ans[q.no], E.self)) : [];
  const got = scores.reduce((a, b) => a + b, 0) - E.hints.size * HINT_COST;
  const groups = [];
  X.experiments.forEach((e, i) => { if (!groups.length || groups[groups.length - 1].g !== e.group) groups.push({ g: e.group, items: [] }); groups[groups.length - 1].items.push({ e, i }); });
  const qHtml = (q) => {
    const a = E.ans[q.no];
    const sc = graded ? examScore(q, a, E.self) : null;
    let input = '';
    if (q.type === 'assign') input = `<div class="assign">${q.items.map((it, i) => `<div class="arow"><b>${esc(it)}</b><div class="row" data-assign="${q.no}" data-item="${esc(it)}">${q.options.map((o) => `<button class="chip ${graded && q.answer[i] === o ? 'right' : ''}" data-v="${esc(o)}" aria-pressed="${(a || {})[it] === o}" ${graded ? 'disabled' : ''}>${esc(o)}</button>`).join('')}</div></div>`).join('')}</div>`;
    else if (q.type === 'essay') input = `<textarea class="ans essay" data-q="${q.no}" rows="3" placeholder="紙に書いてから打ち込む（自己採点）" ${graded ? 'disabled' : ''}>${esc(a || '')}</textarea>`;
    else if (q.type === 'draw') input = drawInputHtml(q, a, graded);
    else
    if (q.type === 'formula') input = `<input class="ans" data-q="${q.no}" inputmode="text" autocomplete="off" placeholder="例: C8H10O" value="${esc(a || '')}" ${graded ? 'disabled' : ''}>`;
    else if (q.type === 'number') input = `<span class="numrow"><input class="ans" data-q="${q.no}" type="number" inputmode="numeric" value="${esc(a ?? '')}" ${graded ? 'disabled' : ''}> ${esc(q.unit || '')}</span>`;
    else if (q.type === 'choice') input = `<div class="row" data-qopts="${q.no}">${q.options.map((o) => `<button class="chip ${graded && q.answer.includes(o) ? 'right' : ''}" data-v="${esc(o)}" aria-pressed="${(a || []).includes(o)}" ${graded ? 'disabled' : ''}>${esc(o)}</button>`).join('')}</div>`;
    else input = `<div class="optgrid ${q.options.some((o) => o.replace(/[^A-Za-z]/g, '').length > 16) ? 'wide' : ''}" data-qopts="${q.no}" data-multi="${q.type === 'multi'}">${q.options.map((o) => molOpt(o, (a || []).includes(o), graded ? (q.answer.includes(o) ? 'right' : (a || []).includes(o) ? 'wrong' : '') : '', graded)).join('')}</div>`;
    const answerText = q.type === 'draw' ? `<span class="figrow">${q.answer.map((sm) => `<span class="fig"><span class="mol">${molSvg(sm)}</span></span>`).join('')}</span>${answered(q, a) ? (() => { const g = drawResult(q, a); return g.error ? `<span class="muted">入力が読めない: ${esc(g.error)}</span>` : `<span class="muted">一致 ${g.hits} / ${g.n}${g.extra ? `、余分 ${g.extra}` : ''}</span>`; })() : ''}`
      : q.type === 'formula' ? fmtFormula(q.answer) : q.type === 'number' ? `${q.answer} ${esc(q.unit || '')}` : q.type === 'choice' ? esc(q.answer[0])
      : q.type === 'assign' ? q.items.map((it, i) => `${esc(it)} → ${esc(q.answer[i])}`).join('、') : q.type === 'essay' ? `（模範解答）${esc(q.model)}`
      : `緑の枠の構造${q.answer.map((s) => DATA.molecules[s] && DATA.molecules[s].name).filter(Boolean).length ? `（${q.answer.map((s) => DATA.molecules[s] && DATA.molecules[s].name).filter(Boolean).map(esc).join('、')}）` : ''}`;
    const selfBtns = graded && q.type === 'essay' && q.rubric && q.rubric.length ? `<div class="rubric" data-rub="${q.no}"><span class="muted">採点基準（入っている要素にチェック。1つにつき ${Math.round(q.points / q.rubric.length * 10) / 10} 点）</span>${q.rubric.map((t, i) => `<label><input type="checkbox" data-ri="${i}" ${((E.self[q.no] || []).includes(i)) ? 'checked' : ''}> ${esc(t)}</label>`).join('')}</div>`
      : graded && q.type === 'essay' ? `<div class="row selfgrade" data-self="${q.no}"><span class="muted">自己採点:</span>${[[1, '要点がすべて入っている'], [0.5, '半分'], [0, '入っていない']].map(([v, t]) => `<button class="chip" data-sv="${v}" aria-pressed="${E.self[q.no] === v}">${t}</button>`).join('')}</div>` : '';
    return `<section class="q ${graded ? (sc === q.points ? 'ok' : sc > 0 ? 'part' : 'ng') : ''}" id="q${q.no}">
      ${graded ? `<span class="stamp" aria-hidden="true">${sc === q.points ? '〇' : sc > 0 ? '△' : '×'}</span>` : ''}
      <div class="qhead"><b>問${q.no}</b><span class="pts">${graded ? `${sc} / ` : ''}${q.points} 点</span></div>
      ${graded && q.type !== 'essay' ? qRateHtml(P.id, q.no) : ''}
      <p class="qp">${esc(q.prompt)}${q.type === 'multi' ? '<span class="muted">（複数選択）</span>' : ''}</p>
      ${q.notes && q.notes.length ? `<ul class="qnotes">${q.notes.map((n) => `<li>${esc(n)}</li>`).join('')}</ul>` : ''}
      ${input}
      ${graded ? `<div class="expl"><p><b>正解</b> ${answerText}</p>${q.refs && q.refs.length ? `<p class="muted">根拠: 実験${q.refs.join('')}</p>` : ''}<p>${esc(q.explain || '')}</p>${selfBtns}</div>` : ''}
    </section>`;
  };
  $('#app').innerHTML = `
    <div class="stack exam">
      <div class="row" style="justify-content:space-between">
        <button class="btn ghost" id="back">← 問題一覧</button>
        <span class="muted mono" style="font-size:.85rem">${esc(P.id)} <span class="lv">${gradeBadge(P)}</span></span>
      </div>
      <header><span class="eyebrow">京大形式 ・ ${esc(P.title || '')}</span></header>
      ${X.parts ? k26SheetHtml(X, E) : ''}
      <section class="sheet" ${X.parts ? 'hidden' : ''}>
        ${X.rules && X.rules.length ? `<div class="rules"><b>この問題で用いる反応の規則</b>${X.rules.map((ru) => `<p><span class="rn">${esc(ru.name)}</span> ${esc(ru.text)}</p>`).join('')}</div>` : ''}
        <p class="story">${esc(X.intro)}</p>
        ${groups.map((gr) => `<h3 class="grp">${GROUP(gr.g)}</h3>
          <ol class="exps">${gr.items.map(({ e, i }) => `<li>
            <span class="lab">${esc(e.label)}</span><span class="tx">${esc(e.text)}</span>
            ${e.figs && e.figs.length ? `<div class="figs">${e.figs.map((f) => `<div class="fig"><span class="mol">${molSvg(f)}</span><span class="pn">${esc(molName(f))}</span></div>`).join('')}</div>` : ''}
            ${e.hint ? `<button class="hintbtn" data-h="${i}" aria-expanded="${E.hints.has(i)}">${E.hints.has(i) ? 'わかること' : `わかること（−${HINT_COST}点）`}</button>${E.hints.has(i) ? `<p class="hinttx">${esc(e.hint)}</p>` : ''}` : ''}
          </li>`).join('')}</ol>`).join('')}
        <p class="hint">原子量: H = 1.0, C = 12, N = 14, O = 16。気体 1 mol = 22.4 L（標準状態）。構造は紙に書いてから選ぶ。</p>
      </section>
      ${X.parts ? '' : X.questions.map(qHtml).join('')}
      ${X.parts ? `<div class="k26">${k26RulePane(X)}<div class="stack">${X.parts.map((pt) => `<h3 class="partlab">${esc(pt.label)}</h3>${k26PartHtml(pt, X, E)}${X.questions.filter((q) => q.part === pt.label).map(qHtml).join('')}`).join('')}</div></div>` : ''}
      ${graded ? `<div class="verdict ${got >= X.total * 0.8 ? 'ok' : 'ng'}"><h2>${got} / ${X.total} 点</h2>
        <span class="score">${E.hints.size ? `ヒント ${E.hints.size} 回で −${E.hints.size * HINT_COST}` : 'ヒントなし'}</span></div>
        ${dailyVerdictHtml(P)}
        <div class="row"><button class="btn primary" id="next">次の問題（おまかせ）</button><button class="btn" id="retry">解き直す</button><button class="btn ghost" id="home">問題一覧</button></div>` : ''}
    </div>
    ${graded ? '' : `<div class="dock"><div class="dock-in"><p class="hint">${X.questions.filter((q) => answered(q, E.ans[q.no])).length} / ${X.questions.length} 問に解答</p><button class="btn primary" id="grade">採点する</button></div></div>`}`;
  $('#back').onclick = () => show('home');
  const app = $('#app');
  app.oninput = (e) => {
    const t = e.target.closest('input.ans, textarea.ans');
    if (!t || graded) return;
    E.ans[+t.dataset.q] = t.value;
    if (t.dataset.draw) { const pv = document.getElementById(`prev-${t.dataset.q}`); if (pv) pv.innerHTML = previewHtml(t.value); }
    const dock = document.querySelector('.dock .hint');
    if (dock) dock.textContent = `${X.questions.filter((q) => answered(q, E.ans[q.no])).length} / ${X.questions.length} 問に解答`;
  };
  app.onclick = (e) => {
    // SMILES の入力補助ボタン: カーソルの位置に文字を入れる
    const pb = e.target.closest('[data-pal] [data-ins]');
    if (pb && !graded) {
      const no = pb.closest('[data-pal]').dataset.pal;
      const ta = app.querySelector(`textarea[data-q="${no}"]`);
      const st = ta.selectionStart ?? ta.value.length, en = ta.selectionEnd ?? ta.value.length;
      const ins = pb.dataset.ins === '⏎' ? '\n' : pb.dataset.ins;
      if (pb.dataset.ins === '⌫') { ta.value = ta.value.slice(0, Math.max(0, st - (st === en ? 1 : 0))) + ta.value.slice(en); ta.selectionStart = ta.selectionEnd = Math.max(0, st - (st === en ? 1 : 0)); }
      else { ta.value = ta.value.slice(0, st) + ins + ta.value.slice(en); ta.selectionStart = ta.selectionEnd = st + ins.length; }
      ta.dispatchEvent(new Event('input', { bubbles: true }));
      ta.focus();
      return;
    }
    const rb = e.target.closest('[data-rub] input[data-ri]');
    if (rb && graded) {
      const no = +rb.closest('[data-rub]').dataset.rub;
      const cur = new Set(E.self[no] || []);
      if (rb.checked) cur.add(+rb.dataset.ri); else cur.delete(+rb.dataset.ri);
      E.self[no] = [...cur];
      const y = window.scrollY; renderExam(); window.scrollTo(0, y);
      return;
    }
    const h = e.target.closest('[data-h]');
    if (h) { E.hints.add(+h.dataset.h); const y = window.scrollY; renderExam(); window.scrollTo(0, y); return; }
    const asg = e.target.closest('[data-assign] [data-v]');
    if (asg && !graded) {
      const row = asg.closest('[data-assign]');
      const no = +row.dataset.assign;
      E.ans[no] = { ...(E.ans[no] || {}), [row.dataset.item]: asg.dataset.v };
      row.querySelectorAll('[data-v]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.v === asg.dataset.v));
      const dock = document.querySelector('.dock .hint');
      if (dock) dock.textContent = `${X.questions.filter((q) => answered(q, E.ans[q.no])).length} / ${X.questions.length} 問に解答`;
      return;
    }
    const sv = e.target.closest('[data-self] [data-sv]');
    if (sv && graded) {
      E.self[+sv.closest('[data-self]').dataset.self] = +sv.dataset.sv;
      const y = window.scrollY; renderExam(); window.scrollTo(0, y);
      return;
    }
    const opt = e.target.closest('[data-qopts] [data-v]');
    if (opt && !graded) {
      const box = opt.closest('[data-qopts]');
      const no = +box.dataset.qopts;
      const multi = box.dataset.multi === 'true';
      const v = opt.dataset.v;
      let cur = E.ans[no] || [];
      cur = multi ? (cur.includes(v) ? cur.filter((x) => x !== v) : [...cur, v]) : (cur[0] === v ? [] : [v]);
      E.ans[no] = cur;
      box.querySelectorAll('[data-v]').forEach((b) => { const on = cur.includes(b.dataset.v); b.classList.toggle('sel', on); b.setAttribute('aria-pressed', on); });
      const dock = document.querySelector('.dock .hint');
      if (dock) dock.textContent = `${X.questions.filter((q) => answered(q, E.ans[q.no])).length} / ${X.questions.length} 問に解答`;
      return;
    }
    if (e.target.id === 'grade') {
      const empty = X.questions.filter((q) => !answered(q, E.ans[q.no])).length;
      // 確認ダイアログは使えない環境があるので、ページの中で2回押しにする
      if (empty && !E.confirmGrade) {
        E.confirmGrade = true;
        const dock = document.querySelector('.dock .hint');
        if (dock) dock.innerHTML = `<b style="color:var(--pos)">${empty} 問が未解答。</b>もう一度押すと採点する`;
        e.target.textContent = 'このまま採点';
        return;
      }
      E.graded = true;
      const sc = X.questions.map((q) => examScore(q, E.ans[q.no], E.self));
      const total = sc.reduce((a, b) => a + b, 0) - E.hints.size * HINT_COST;
      const qs = store.qstat[P.id] || { n: 0, m: {} };
      qs.n++;
      // 記述は自己採点の前なので数えない
      X.questions.forEach((q, i) => { if (q.type !== 'essay' && sc[i] < q.points) qs.m[q.no] = (qs.m[q.no] || 0) + 1; });
      store.qstat[P.id] = qs;
      const pct = Math.max(0, Math.round((100 * total) / X.total));
      finishDaily(P, pct);
      record(P.id, sc.every((v, i) => v === X.questions[i].points), pct);
      render(); window.scrollTo(0, 0);
      return;
    }
    if (e.target.id === 'next') { app.onclick = null; app.oninput = null; if (P.pool) { customGo(P.id); return; } startProblem(pickProblem(view.level, P.id)); return; }
    if (e.target.id === 'retry') { app.onclick = null; app.oninput = null; startProblem(P); return; }
    if (e.target.id === 'home') { app.onclick = null; app.oninput = null; show('home'); }
  };
}

function render() {
  const app0 = document.getElementById('app');
  if (app0) app0.classList.toggle('wide', view.screen === 'exam' && !!(game && game.exam && game.exam.P.exam && game.exam.P.exam.parts));
  if (view.screen !== 'exam' && app0) { app0.onclick = null; app0.oninput = null; }
  const s = view.screen;
  if (s === 'play' && game && game.p) renderPlay();
  else if (s === 'result' && game && game.done) renderResult();
  else if (s === 'split' && game && game.split) renderSplit();
  else if (s === 'given' && game && game.big) renderGiven();
  else if (s === 'bigdone' && game && game.big) renderBigDone();
  else if (s === 'calc' && game && game.calc) renderCalc();
  else if (s === 'rank') renderRank();
  else if (s === 'posts') renderPosts();
  else if (s === 'daily') renderDaily();
  else if (s === 'custom') renderCustom();
  else if (s === 'know') renderKnowPick();
  else if (s === 'quiz' && quiz.items.length) renderQuiz();
  else if (s === 'miss') renderMiss();
  else if (s === 'race') renderRaceHome();
  else if (s === 'raceplay' && race.rm && race.round) renderRacePlay();
  else if (s === 'count' && game && game.count) renderCount();
  else if (s === 'exam' && game && game.exam) renderExam();
  else renderHome();
}

if (!DATA) {
  $('#app').innerHTML = '<p>問題データがない。<code>npm run build</code> で dist/index.html を作る。</p>';
} else {
  checkNight();
  setInterval(checkNight, 30000);
  render();
  initOnline().catch(() => { online.ready = true; online.off = true; refreshOnline(); });
}
</script>
