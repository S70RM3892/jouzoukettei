name: pages

# main に入った版をビルドし、GitHub Pages で公開する。
# 毎朝5時（日本時間）にも走らせ、その日の日付を種にして京大レベルの問題を作り直す。
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 20 * * *' # 20:00 UTC = 5:00 JST（夜間ロックが明ける時刻）
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --no-audit --no-fund
      - name: 判定ロジックのテストと問題の検証
        run: npm test
      # 断片ライブラリ（異性体の全列挙で約3分）はソースが変わらない限り使い回す
      - uses: actions/cache@v4
        with:
          path: generated/library.json
          key: fragment-library-${{ hashFiles('src/generator.js', 'src/enumerate.js', 'src/chem.js') }}
      - name: 出題予測と、今日の京大レベルの問題を生成
        run: |
          npm run forecast
          npm run generate -- "$(TZ=Asia/Tokyo date +%Y%m%d)" 12
          npm run validate
      - name: dist/index.html を生成
        run: npm run build
      - name: 公開するファイルを用意
        run: |
          mkdir -p site
          cp dist/index.html site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
